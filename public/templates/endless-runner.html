<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Endless Runner</title>
  <style>
    :root {
      --bg: #0a0a1a;
      --hud-color: #ffffff;
      --accent: #00e5ff;
      --danger: #ff3d71;
      --lane-width: 80px;
      --game-speed: 5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      touch-action: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* HUD overlay */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--hud-color);
      font-size: 16px;
      font-weight: 700;
      pointer-events: none;
      z-index: 10;
    }
    #hud .score { font-size: 24px; }
    #hud .coins { color: #ffd700; }
    /* Menu overlay */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,26,0.92);
      z-index: 20;
      gap: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay h1 {
      font-size: clamp(28px, 6vw, 48px);
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0,229,255,0.4);
    }
    .overlay .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
    }
    .overlay button {
      padding: 14px 40px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: var(--bg);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .overlay button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 24px rgba(0,229,255,0.4);
    }
    .overlay .high-score {
      color: #ffd700;
      font-size: 18px;
      font-weight: 600;
    }
    /* Pause button */
    #pause-btn {
      position: fixed;
      top: 12px; right: 16px;
      width: 40px; height: 40px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      z-index: 15;
      pointer-events: auto;
    }
    /* Mute button */
    #mute-btn {
      position: fixed;
      top: 12px; right: 64px;
      width: 40px; height: 40px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      z-index: 15;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <span class="score" id="score-display">0</span>
    <span class="coins" id="coin-display">0</span>
  </div>
  <button id="pause-btn">⏸</button>
  <button id="mute-btn">🔊</button>
  <!-- Menu overlay -->
  <div class="overlay" id="menu-screen">
    <h1><!-- Game Title --></h1>
    <p class="subtitle">Swipe or use arrow keys</p>
    <button id="play-btn">PLAY</button>
    <div class="high-score" id="menu-highscore"></div>
  </div>
  <!-- Game Over overlay -->
  <div class="overlay hidden" id="gameover-screen">
    <h1>GAME OVER</h1>
    <div class="score" id="final-score" style="color:#fff;font-size:36px;font-weight:800"></div>
    <div class="high-score" id="go-highscore"></div>
    <button id="retry-btn">TRY AGAIN</button>
  </div>
  <!-- Pause overlay -->
  <div class="overlay hidden" id="pause-screen">
    <h1>PAUSED</h1>
    <button id="resume-btn">RESUME</button>
  </div>

</body>
</html>
