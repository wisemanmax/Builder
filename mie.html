<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080812">
<title>GradBridge Market Intelligence Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="mie-app">
  <aside id="mie-sidebar" class="mie-sidebar">
    <div class="mie-logo">
      <span class="mie-logo-icon">&#x1F4CA;</span>
      <div>
        <div class="mie-logo-title">GradBridge</div>
        <div class="mie-logo-sub">Market Intelligence</div>
      </div>
    </div>
    <nav id="mie-nav"></nav>
    <div class="mie-sidebar-footer">
      <div class="mie-mode-toggle" id="mie-mode-toggle">
        <button class="mie-mode-btn active" data-mode="internal">Internal</button>
        <button class="mie-mode-btn" data-mode="borrower">Match Tool</button>
      </div>
    </div>
  </aside>
  <main id="mie-main" class="mie-main">
    <header class="mie-header">
      <button class="mie-menu-btn" id="mie-menu-btn">&#x2630;</button>
      <h1 class="mie-header-title" id="mie-header-title">Overview</h1>
      <div class="mie-header-right">
        <span class="mie-badge" id="mie-alert-badge">3 Alerts</span>
      </div>
    </header>
    <div class="mie-content" id="mie-content"></div>
  </main>
</div>
<script type="module" src="/src/mie/mie-app.js"></script>
</body>
</html>
