<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymTracker Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --text-muted: #666666;
            --accent: #00ff88;
            --accent-dark: #00cc6a;
            --danger: #ff4444;
            --warning: #ffaa00;
            --border: #333333;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            min-width: 120px;
        }

        .tab-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px var(--shadow);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: var(--accent);
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 255, 136, 0.2);
        }

        .btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #cc3333;
        }

        .workout-list {
            display: grid;
            gap: 20px;
        }

        .workout-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .workout-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .workout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .workout-date {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .exercise-list {
            display: grid;
            gap: 10px;
        }

        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--bg-secondary);
            border-radius: 6px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .exercise-name {
            font-weight: 500;
            color: var(--accent);
        }

        .exercise-details {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .pr-badge {
            background: linear-gradient(135deg, #ffaa00, #ff6600);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #00ccff);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .pr-list {
            display: grid;
            gap: 15px;
        }

        .pr-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .pr-info h4 {
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .pr-details {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .pr-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .app-container {
                padding: 15px;
            }

            .logo {
                font-size: 2rem;
            }

            .nav-tabs {
                gap: 10px;
            }

            .tab-btn {
                padding: 10px 16px;
                font-size: 0.9rem;
                min-width: 100px;
            }

            .card {
                padding: 20px;
            }

            .workout-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .exercise-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .pr-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .stat-number {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">GymTracker Pro</div>
            <div class="subtitle">Track Your Progress • Beat Your PRs</div>
        </header>

        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('log')">Log Workout</button>
            <button class="tab-btn" onclick="switchTab('history')">History</button>
            <button class="tab-btn" onclick="switchTab('prs')">Personal Records</button>
            <button class="tab-btn" onclick="switchTab('stats')">Statistics</button>
        </nav>

        <!-- Log Workout Tab -->
        <div id="log" class="tab-content active">
            <div class="card">
                <h3>🏋️‍♂️ Log New Workout</h3>
                <form id="workoutForm">
                    <div class="form-group">
                        <label for="workoutDate">Date</label>
                        <input type="date" id="workoutDate" required>
                    </div>
                    <div class="form-group">
                        <label for="workoutNotes">Workout Notes (Optional)</label>
                        <textarea id="workoutNotes" rows="3" placeholder="How did you feel? Any observations?"></textarea>
                    </div>
                </form>
            </div>

            <div class="card">
                <h3>📝 Add Exercise</h3>
                <form id="exerciseForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="exerciseName">Exercise</label>
                            <select id="exerciseName" required>
                                <option value="">Select exercise</option>
                                <option value="Bench Press">Bench Press</option>
                                <option value="Squat">Squat</option>
                                <option value="Deadlift">Deadlift</option>
                                <option value="Overhead Press">Overhead Press</option>
                                <option value="Barbell Row">Barbell Row</option>
                                <option value="Pull-ups">Pull-ups</option>
                                <option value="Dips">Dips</option>
                                <option value="Bicep Curls">Bicep Curls</option>
                                <option value="Tricep Extensions">Tricep Extensions</option>
                                <option value="Lat Pulldown">Lat Pulldown</option>
                                <option value="Leg Press">Leg Press</option>
                                <option value="Shoulder Press">Shoulder Press</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="exerciseWeight">Weight (lbs)</label>
                            <input type="number" id="exerciseWeight" min="0" step="0.5" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="exerciseReps">Reps</label>
                            <input type="number" id="exerciseReps" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="exerciseSets">Sets</label>
                            <input type="number" id="exerciseSets" min="1" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">Add Exercise</button>
                </form>
            </div>

            <div class="card" id="currentWorkout" style="display: none;">
                <h3>📋 Current Workout</h3>
                <div id="currentExercises"></div>
                <button type="button" class="btn" onclick="saveWorkout()" style="margin-top: 20px;">Save Workout</button>
                <button type="button" class="btn btn-danger" onclick="clearCurrentWorkout()" style="margin-left: 10px;">Clear</button>
            </div>
        </div>

        <!-- History Tab -->
        <div id="history" class="tab-content">
            <div class="card">
                <h3>📅 Workout History</h3>
                <div id="workoutHistory"></div>
            </div>
        </div>

        <!-- PRs Tab -->
        <div id="prs" class="tab-content">
            <div class="card">
                <h3>🏆 Personal Records</h3>
                <div id="personalRecords"></div>
            </div>
        </div>

        <!-- Stats Tab -->
        <div id="stats" class="tab-content">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="card">
                <h3>📊 Exercise Frequency</h3>
                <div id="exerciseFrequency"></div>
            </div>
        </div>
    </div>

    <script>
        // Initialize the app
        let currentWorkoutExercises = [];

        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Set today's date
            document.getElementById('workoutDate').value = new Date().toISOString().split('T')[0];
            
            // Load initial data
            loadWorkoutHistory();
            loadPersonalRecords();
            loadStats();
            
            // Initialize with sample data if no data exists
            if (!localStorage.getItem('gymWorkouts')) {
                initializeSampleData();
            }
        });

        // Sample data initialization
        function initializeSampleData() {
            const sampleWorkouts = [
                {
                    id: 1,
                    date: '2024-01-15',
                    notes: 'Great session! Felt strong today',
                    exercises: [
                        { name: 'Bench Press', weight: 185, reps: 8, sets: 3 },
                        { name: 'Squat', weight: 225, reps: 6, sets: 3 },
                        { name: 'Barbell Row', weight: 155, reps: 8, sets: 3 }
                    ]
                },
                {
                    id: 2,
                    date: '2024-01-12',
                    notes: 'Focused on form and technique',
                    exercises: [
                        { name: 'Deadlift', weight: 275, reps: 5, sets: 3 },
                        { name: 'Overhead Press', weight: 95, reps: 8, sets: 3 },
                        { name: 'Pull-ups', weight: 0, reps: 12, sets: 3 }
                    ]
                },
                {
                    id: 3,
                    date: '2024-01-10',
                    notes: 'New PR on bench press!',
                    exercises: [
                        { name: 'Bench Press', weight: 190, reps: 6, sets: 3 },
                        { name: 'Dips', weight: 25, reps: 10, sets: 3 },
                        { name: 'Bicep Curls', weight: 35, reps: 12, sets: 3 }
                    ]
                }
            ];
            
            localStorage.setItem('gymWorkouts', JSON.stringify(sampleWorkouts));
            loadWorkoutHistory();
            loadPersonalRecords();
            loadStats();
        }

        // Tab switching
        function switchTab(tabName) {
            // Remove active class from all tabs and content
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // Add active class to clicked tab and corresponding content
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            // Load content based on tab
            switch(tabName) {
                case 'history':
                    loadWorkoutHistory();
                    break;
                case 'prs':
                    loadPersonalRecords();
                    break;
                case 'stats':
                    loadStats();
                    break;
            }
        }

        // Exercise form submission
        document.getElementById('exerciseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const exercise = {
                name: document.getElementById('exerciseName').value,
                weight: parseFloat(document.getElementById('exerciseWeight').value),
                reps: parseInt(document.getElementById('exerciseReps').value),
                sets: parseInt(document.getElementById('exerciseSets').value)
            };
            
            currentWorkoutExercises.push(exercise);
            displayCurrentWorkout();
            
            // Reset form
            this.reset();
        });

        // Display current workout
        function displayCurrentWorkout() {
            const container = document.getElementById('currentExercises');
            const workoutDiv = document.getElementById('currentWorkout');
            
            if (currentWorkoutExercises.length === 0) {
                workoutDiv.style.display = 'none';
                return;
            }
            
            workoutDiv.style.display = 'block';
            container.innerHTML = currentWorkoutExercises.map((exercise, index) => `
                <div class="exercise-item">
                    <div>
                        <div class="exercise-name">${exercise.name}</div>
                        <div class="exercise-details">${exercise.weight} lbs × ${exercise.reps} reps × ${exercise.sets} sets</div>
                    </div>
                    <button class="btn btn-danger" onclick="removeExercise(${index})" style="padding: 5px 10px; font-size: 0.8rem;">Remove</button>
                </div>
            `).join('');
        }

        // Remove exercise from current workout
        function removeExercise(index) {
            currentWorkoutExercises.splice(index, 1);
            displayCurrentWorkout();
        }

        // Clear current workout
        function clearCurrentWorkout() {
            currentWorkoutExercises = [];
            displayCurrentWorkout();
        }

        // Save workout
        function saveWorkout() {
            if (currentWorkoutExercises.length === 0) {
                return;
            }
            
            const workouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
            const newWorkout = {
                id: Date.now(),
                date: document.getElementById('workoutDate').value,
                notes: document.getElementById('workoutNotes').value,
                exercises: [...currentWorkoutExercises]
            };
            
            workouts.unshift(newWorkout);
            localStorage.setItem('gymWorkouts', JSON.stringify(workouts));
            
            // Clear current workout
            clearCurrentWorkout();
            document.getElementById('workoutForm').reset();
            document.getElementById('workoutDate').value = new Date().toISOString().split('T')[0];
            
            // Update displays
            loadWorkoutHistory();
            loadPersonalRecords();
            loadStats();
        }

        // Load workout history
        function loadWorkoutHistory() {
            const workouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
            const container = document.getElementById('workoutHistory');
            
            if (workouts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        <h3>No workouts logged yet</h3>
                        <p>Start by logging your first workout!</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="workout-list">
                    ${workouts.map(workout => {
                        const prs = checkForPRs(workout);
                        return `
                            <div class="workout-item">
                                <div class="workout-header">
                                    <h4>${formatDate(workout.date)}</h4>
                                    <div class="workout-date">${workout.exercises.length} exercises</div>
                                    <button class="btn btn-danger" onclick="deleteWorkout(${workout.id})" style="padding: 5px 10px; font-size: 0.8rem;">Delete</button>
                                </div>
                                ${workout.notes ? `<p style="color: var(--text-secondary); margin-bottom: 15px; font-style: italic;">"${workout.notes}"</p>` : ''}
                                <div class="exercise-list">
                                    ${workout.exercises.map(exercise => `
                                        <div class="exercise-item">
                                            <div>
                                                <div class="exercise-name">${exercise.name}</div>
                                                <div class="exercise-details">${exercise.weight} lbs × ${exercise.reps} reps × ${exercise.sets} sets</div>
                                            </div>
                                            ${prs.includes(exercise.name) ? '<span class="pr-badge">NEW PR!</span>' : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // Check for PRs in a workout
        function checkForPRs(workout) {
            const workouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
            const prs = [];
            
            workout.exercises.forEach(exercise => {
                let maxWeight = 0;
                workouts.forEach(w => {
                    if (w.id !== workout.id && new Date(w.date) < new Date(workout.date)) {
                        w.exercises.forEach(e => {
                            if (e.name === exercise.name && e.weight > maxWeight) {
                                maxWeight = e.weight;
                            }
                        });
                    }
                });
                
                if (exercise.weight > maxWeight) {
                    prs.push(exercise.name);
                }
            });
            
            return prs;
        }

        // Delete workout
        function deleteWorkout(workoutId) {
            const workouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
            const filteredWorkouts = workouts.filter(w => w.id !== workoutId);
            localStorage.setItem('gymWorkouts', JSON.stringify(filteredWorkouts));
            loadWorkoutHistory();
            loadPersonalRecords();
            loadStats();
        }

        // Load personal records
        function loadPersonalRecords() {
            const workouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
            const container = document.getElementById('personalRecords');
            const prs = {};
            
            workouts.forEach(workout => {
                workout.exercises.forEach(exercise => {
                    if (!prs[exercise.name] || exercise.weight > prs[exercise.name].weight) {
                        prs[exercise.name] = {
                            weight: exercise.weight,
                            reps: exercise.reps,
                            date: workout.date
                        };
                    }
                });
            });
            
            const prArray = Object.entries(prs).sort((a, b) => b[1].weight - a[1].weight);
            
            if (prArray.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        <h3>No personal records yet</h3>
                        <p>Complete some workouts to see your PRs!</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="pr-list">
                    ${prArray.map(([exercise, pr]) => `
                        <div class="pr-item">
                            <div class="pr-info">
                                <h4>${exercise}</h4>
                                <div class="pr-details">${pr.reps} reps • ${formatDate(pr.date)}</div>
                            </div>
                            <div class="pr-value">${pr.weight} lbs</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Load statistics
        function loadStats() {
            const workouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
            const statsContainer = document.getElementById('statsGrid');
            const frequencyContainer = document.getElementById('exerciseFrequency');
            
            // Calculate basic stats
            const totalWorkouts = workouts.length;
            const totalExercises = workouts.reduce((sum, w) => sum + w.exercises.length, 0);
            const totalVolume = workouts.reduce((sum, w) => {
                return sum + w.exercises.reduce((exerciseSum, e) => {
                    return exerciseSum + (e.weight * e.reps * e.sets);
                }, 0);
            }, 0);
            
            // Calculate workout streak
            let streak = 0;
            const sortedDates = workouts.map(w => w.date).sort().reverse();
            let currentDate = new Date();
            
            for (let date of sortedDates) {
                const workoutDate = new Date(date);
                const daysDiff = Math.floor((currentDate - workoutDate) / (1000 * 60 * 60 * 24));
                
                if (daysDiff <= 7) {
                    streak++;
                    currentDate = workoutDate;
                } else {
                    break;
                }
            }
            
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalWorkouts}</div>
                    <div class="stat-label">Total Workouts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${totalExercises}</div>
                    <div class="stat-label">Exercises Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${Math.round(totalVolume).toLocaleString()}</div>
                    <div class="stat-label">Total Volume (lbs)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${streak}</div>
                    <div class="stat-label">Workout Streak</div>
                </div>
            `;
            
            // Exercise frequency
            const exerciseCount = {};
            workouts.forEach(workout => {
                workout.exercises.forEach(exercise => {
                    exerciseCount[exercise.name] = (exerciseCount[exercise.name] || 0) + 1;
                });
            });
            
            const sortedExercises = Object.entries(exerciseCount).sort((a, b) => b[1] - a[1]);
            
            if (sortedExercises.length === 0) {
                frequencyContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>No exercise data yet</h3>
                        <p>Complete some workouts to see your most popular exercises!</p>
                    </div>
                `;
                return;
            }
            
            frequencyContainer.innerHTML = `
                <div class="exercise-list">
                    ${sortedExercises.slice(0, 10).map(([exercise, count]) => `
                        <div class="exercise-item">
                            <div class="exercise-name">${exercise}</div>
                            <div class="exercise-details">${count} times</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Utility function to format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                weekday: 'short', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }
    </script>
</body>
</html>
