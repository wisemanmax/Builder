<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@100;200;300;400;500;600;700;800;900&display=swap');
        
        :root {
            --bg-primary: #000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent: #007aff;
            --accent-hover: #0056b3;
            --border: #38383a;
            --gradient-1: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            --gradient-2: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-3: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --shadow: rgba(0, 0, 0, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.4;
            overflow-x: hidden;
        }
        
        .app-container {
            min-height: 100vh;
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 50%, #000 100%);
            position: relative;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        
        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            animation: slideDown 0.6s ease-out;
        }
        
        .search-input {
            flex: 1;
            padding: 15px 20px;
            background: rgba(28, 28, 30, 0.8);
            border: 1px solid var(--border);
            border-radius: 15px;
            color: var(--text-primary);
            font-size: 16px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.3);
        }
        
        .search-btn {
            padding: 15px 20px;
            background: var(--accent);
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }
        
        .current-weather {
            background: rgba(28, 28, 30, 0.3);
            backdrop-filter: blur(30px);
            border-radius: 25px;
            padding: 40px 30px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        .current-weather::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .location {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .date-time {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        
        .current-temp {
            font-size: 80px;
            font-weight: 100;
            margin: 20px 0;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }
        
        .weather-icon {
            font-size: 60px;
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }
        
        .weather-desc {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        
        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }
        
        .detail-item {
            text-align: center;
        }
        
        .detail-value {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .detail-label {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .forecast-container {
            background: rgba(28, 28, 30, 0.3);
            backdrop-filter: blur(30px);
            border-radius: 25px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 1s ease-out;
        }
        
        .forecast-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .forecast-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .forecast-item:last-child {
            border-bottom: none;
        }
        
        .forecast-item:hover {
            transform: translateX(10px);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px 20px;
        }
        
        .forecast-day {
            font-weight: 600;
            font-size: 16px;
            min-width: 80px;
        }
        
        .forecast-weather {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }
        
        .forecast-icon {
            font-size: 24px;
        }
        
        .forecast-desc {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .forecast-temps {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .temp-high {
            font-weight: 600;
            font-size: 16px;
        }
        
        .temp-low {
            color: var(--text-secondary);
            font-size: 16px;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 18px;
            color: var(--text-secondary);
        }
        
        .loading::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-secondary);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            margin-left: 10px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes slideDown {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .error {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: #ff3b30;
            margin: 20px 0;
            backdrop-filter: blur(20px);
        }
        
        .hourly-forecast {
            background: rgba(28, 28, 30, 0.3);
            backdrop-filter: blur(30px);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.9s ease-out;
        }
        
        .hourly-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .hourly-list {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        
        .hourly-list::-webkit-scrollbar {
            height: 4px;
        }
        
        .hourly-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        
        .hourly-list::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 2px;
        }
        
        .hourly-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            padding: 15px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            transition: all 0.3s ease;
        }
        
        .hourly-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .hourly-time {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        
        .hourly-icon {
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .hourly-temp {
            font-size: 14px;
            font-weight: 600;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .current-temp {
                font-size: 60px;
            }
            
            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .forecast-item {
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .forecast-day {
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="stars" id="stars"></div>
        <div class="container">
            <div class="search-bar">
                <input type="text" class="search-input" id="zipcode" placeholder="Enter ZIP code or city name" value="10001">
                <button class="search-btn" onclick="getWeather()">Search</button>
            </div>
            
            <div id="weather-content">
                <div class="current-weather">
                    <div class="location" id="location">New York, NY</div>
                    <div class="date-time" id="datetime">Thursday, January 18, 2024 • 2:30 PM</div>
                    <div class="weather-icon" id="current-icon">☀️</div>
                    <div class="current-temp" id="current-temp">72°</div>
                    <div class="weather-desc" id="weather-desc">Partly Cloudy</div>
                    
                    <div class="weather-details">
                        <div class="detail-item">
                            <div class="detail-value" id="feels-like">75°</div>
                            <div class="detail-label">Feels like</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value" id="humidity">65%</div>
                            <div class="detail-label">Humidity</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value" id="wind">8 mph</div>
                            <div class="detail-label">Wind</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value" id="pressure">30.12</div>
                            <div class="detail-label">Pressure</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value" id="visibility">10 mi</div>
                            <div class="detail-label">Visibility</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value" id="uv-index">6</div>
                            <div class="detail-label">UV Index</div>
                        </div>
                    </div>
                </div>
                
                <div class="hourly-forecast">
                    <div class="hourly-title">📊 24-Hour Forecast</div>
                    <div class="hourly-list" id="hourly-list">
                        <!-- Hourly items will be populated by JavaScript -->
                    </div>
                </div>
                
                <div class="forecast-container">
                    <div class="forecast-title">
                        📅 7-Day Forecast
                    </div>
                    <div class="forecast-list" id="forecast-list">
                        <!-- Forecast items will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample weather data
        const sampleWeatherData = {
            "10001": {
                location: "New York, NY",
                current: {
                    temp: 72,
                    feelsLike: 75,
                    condition: "Partly Cloudy",
                    icon: "⛅",
                    humidity: 65,
                    wind: 8,
                    pressure: 30.12,
                    visibility: 10,
                    uvIndex: 6
                },
                hourly: [
                    { time: "Now", icon: "⛅", temp: 72 },
                    { time: "3 PM", icon: "☀️", temp: 74 },
                    { time: "4 PM", icon: "☀️", temp: 76 },
                    { time: "5 PM", icon: "🌤️", temp: 75 },
                    { time: "6 PM", icon: "🌤️", temp: 73 },
                    { time: "7 PM", icon: "🌅", temp: 71 },
                    { time: "8 PM", icon: "🌆", temp: 68 },
                    { time: "9 PM", icon: "🌙", temp: 65 }
                ],
                forecast: [
                    { day: "Today", icon: "⛅", desc: "Partly Cloudy", high: 76, low: 62 },
                    { day: "Friday", icon: "☀️", desc: "Sunny", high: 79, low: 65 },
                    { day: "Saturday", icon: "🌧️", desc: "Light Rain", high: 73, low: 58 },
                    { day: "Sunday", icon: "⛈️", desc: "Thunderstorms", high: 71, low: 55 },
                    { day: "Monday", icon: "🌤️", desc: "Partly Sunny", high: 75, low: 61 },
                    { day: "Tuesday", icon: "☀️", desc: "Sunny", high: 78, low: 64 },
                    { day: "Wednesday", icon: "🌥️", desc: "Mostly Cloudy", high: 74, low: 59 }
                ]
            },
            "90210": {
                location: "Beverly Hills, CA",
                current: {
                    temp: 85,
                    feelsLike: 88,
                    condition: "Sunny",
                    icon: "☀️",
                    humidity: 45,
                    wind: 5,
                    pressure: 29.98,
                    visibility: 15,
                    uvIndex: 9
                },
                hourly: [
                    { time: "Now", icon: "☀️", temp: 85 },
                    { time: "3 PM", icon: "☀️", temp: 87 },
                    { time: "4 PM", icon: "☀️", temp: 89 },
                    { time: "5 PM", icon: "☀️", temp: 88 },
                    { time: "6 PM", icon: "🌤️", temp: 86 },
                    { time: "7 PM", icon: "🌅", temp: 83 },
                    { time: "8 PM", icon: "🌆", temp: 79 },
                    { time: "9 PM", icon: "🌙", temp: 76 }
                ],
                forecast: [
                    { day: "Today", icon: "☀️", desc: "Sunny", high: 89, low: 71 },
                    { day: "Friday", icon: "☀️", desc: "Sunny", high: 91, low: 73 },
                    { day: "Saturday", icon: "☀️", desc: "Sunny", high: 88, low: 70 },
                    { day: "Sunday", icon: "🌤️", desc: "Partly Sunny", high: 86, low: 68 },
                    { day: "Monday", icon: "☀️", desc: "Sunny", high: 90, low: 72 },
                    { day: "Tuesday", icon: "🌫️", desc: "Foggy Morning", high: 84, low: 66 },
                    { day: "Wednesday", icon: "☀️", desc: "Sunny", high: 87, low: 69 }
                ]
            },
            "33101": {
                location: "Miami, FL",
                current: {
                    temp: 82,
                    feelsLike: 89,
                    condition: "Thunderstorms",
                    icon: "⛈️",
                    humidity: 78,
                    wind: 12,
                    pressure: 29.87,
                    visibility: 6,
                    uvIndex: 4
                },
                hourly: [
                    { time: "Now", icon: "⛈️", temp: 82 },
                    { time: "3 PM", icon: "🌧️", temp: 81 },
                    { time: "4 PM", icon: "🌦️", temp: 83 },
                    { time: "5 PM", icon: "🌤️", temp: 84 },
                    { time: "6 PM", icon: "☀️", temp: 85 },
                    { time: "7 PM", icon: "🌅", temp: 83 },
                    { time: "8 PM", icon: "🌆", temp: 80 },
                    { time: "9 PM", icon: "🌙", temp: 78 }
                ],
                forecast: [
                    { day: "Today", icon: "⛈️", desc: "Thunderstorms", high: 85, low: 76 },
                    { day: "Friday", icon: "🌦️", desc: "Scattered Showers", high: 87, low: 78 },
                    { day: "Saturday", icon: "🌤️", desc: "Partly Sunny", high: 89, low: 79 },
                    { day: "Sunday", icon: "☀️", desc: "Sunny", high: 91, low: 81 },
                    { day: "Monday", icon: "☀️", desc: "Sunny", high: 90, low: 80 },
                    { day: "Tuesday", icon: "🌧️", desc: "Showers", high: 86, low: 77 },
                    { day: "Wednesday", icon: "⛈️", desc: "Thunderstorms", high: 84, low: 75 }
                ]
            }
        };

        function createStars() {
            const starsContainer = document.getElementById('stars');
            const numStars = 100;
            
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            };
            document.getElementById('datetime').textContent = now.toLocaleDateString('en-US', options);
        }

        function showLoading() {
            const content = document.getElementById('weather-content');
            content.innerHTML = '<div class="loading">Loading weather data</div>';
        }

        function showError(message) {
            const content = document.getElementById('weather-content');
            content.innerHTML = `<div class="error">${message}</div>`;
        }

        function updateWeatherDisplay(data) {
            // Update current weather
            document.getElementById('location').textContent = data.location;
            document.getElementById('current-icon').textContent = data.current.icon;
            document.getElementById('current-temp').textContent = data.current.temp + '°';
            document.getElementById('weather-desc').textContent = data.current.condition;
            document.getElementById('feels-like').textContent = data.current.feelsLike + '°';
            document.getElementById('humidity').textContent = data.current.humidity + '%';
            document.getElementById('wind').textContent = data.current.wind + ' mph';
            document.getElementById('pressure').textContent = data.current.pressure + '"';
            document.getElementById('visibility').textContent = data.current.visibility + ' mi';
            document.getElementById('uv-index').textContent = data.current.uvIndex;

            // Update hourly forecast
            const hourlyList = document.getElementById('hourly-list');
            hourlyList.innerHTML = '';
            data.hourly.forEach(hour => {
                const hourlyItem = document.createElement('div');
                hourlyItem.className = 'hourly-item';
                hourlyItem.innerHTML = `
                    <div class="hourly-time">${hour.time}</div>
                    <div class="hourly-icon">${hour.icon}</div>
                    <div class="hourly-temp">${hour.temp}°</div>
                `;
                hourlyList.appendChild(hourlyItem);
            });

            // Update 7-day forecast
            const forecastList = document.getElementById('forecast-list');
            forecastList.innerHTML = '';
            data.forecast.forEach(day => {
                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <div class="forecast-day">${day.day}</div>
                    <div class="forecast-weather">
                        <div class="forecast-icon">${day.icon}</div>
                        <div class="forecast-desc">${day.desc}</div>
                    </div>
                    <div class="forecast-temps">
                        <div class="temp-high">${day.high}°</div>
                        <div class="temp-low">${day.low}°</div>
                    </div>
                `;
                forecastList.appendChild(forecastItem);
            });

            updateDateTime();
        }

        function getWeather() {
            const zipcode = document.getElementById('zipcode').value.trim();
            
            if (!zipcode) {
                showError('Please enter a ZIP code or city name.');
                return;
            }

            showLoading();

            // Simulate API call delay
            setTimeout(() => {
                const weatherData = sampleWeatherData[zipcode] || sampleWeatherData["10001"];
                
                if (weatherData) {
                    // Restore the original HTML structure
                    const content = document.getElementById('weather-content');
                    content.innerHTML = `
                        <div class="current-weather">
                            <div class="location" id="location">New York, NY</div>
                            <div class="date-time" id="datetime">Thursday, January 18, 2024 • 2:30 PM</div>
                            <div class="weather-icon" id="current-icon">☀️</div>
                            <div class="current-temp" id="current-temp">72°</div>
                            <div class="weather-desc" id="weather-desc">Partly Cloudy</div>
                            
                            <div class="weather-details">
                                <div class="detail-item">
                                    <div class="detail-value" id="feels-like">75°</div>
                                    <div class="detail-label">Feels like</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-value" id="humidity">65%</div>
                                    <div class="detail-label">Humidity</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-value" id="wind">8 mph</div>
                                    <div class="detail-label">Wind</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-value" id="pressure">30.12</div>
                                    <div class="detail-label">Pressure</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-value" id="visibility">10 mi</div>
                                    <div class="detail-label">Visibility</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-value" id="uv-index">6</div>
                                    <div class="detail-label">UV Index</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="hourly-forecast">
                            <div class="hourly-title">📊 24-Hour Forecast</div>
                            <div class="hourly-list" id="hourly-list">
                            </div>
                        </div>
                        
                        <div class="forecast-container">
                            <div class="forecast-title">
                                📅 7-Day Forecast
                            </div>
                            <div class="forecast-list" id="forecast-list">
                            </div>
                        </div>
                    `;
                    
                    updateWeatherDisplay(weatherData);
                } else {
                    showError('Weather data not found for this location. Try ZIP codes: 10001, 90210, or 33101.');
                }
            }, 1500);
        }

        // Handle Enter key in search input
        document.getElementById('zipcode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                getWeather();
            }
        });

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            updateDateTime();
