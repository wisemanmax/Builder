<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI-84 Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap');
        
        :root {
            --bg-dark: #1a1a1a;
            --bg-calculator: #2d2d2d;
            --bg-screen: #0a0a0a;
            --text-primary: #00ff00;
            --text-secondary: #ffffff;
            --button-bg: #404040;
            --button-hover: #555555;
            --button-active: #666666;
            --button-function: #4a4a4a;
            --button-number: #383838;
            --button-operation: #555555;
            --border-color: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background: var(--bg-dark);
            color: var(--text-secondary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator {
            background: var(--bg-calculator);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 350px;
            width: 100%;
        }

        .brand {
            text-align: center;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .screen {
            background: var(--bg-screen);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 80px;
            position: relative;
        }

        .display {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 500;
            text-align: right;
            word-wrap: break-word;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .expression {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .result {
            font-size: 20px;
            font-weight: 700;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .button {
            background: var(--button-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .button:hover {
            background: var(--button-hover);
            transform: translateY(-1px);
        }

        .button:active {
            background: var(--button-active);
            transform: translateY(0);
        }

        .button.function {
            background: var(--button-function);
            font-size: 10px;
        }

        .button.number {
            background: var(--button-number);
            font-size: 16px;
            font-weight: 700;
        }

        .button.operation {
            background: var(--button-operation);
            font-size: 16px;
            font-weight: 700;
        }

        .button.wide {
            grid-column: span 2;
        }

        .button.equals {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            font-weight: 700;
            font-size: 18px;
        }

        .button.equals:hover {
            background: linear-gradient(135deg, #45a049, #3d8b40);
        }

        .button.clear {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            font-weight: 700;
        }

        .button.clear:hover {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
        }

        @media (max-width: 480px) {
            .calculator {
                max-width: 320px;
            }
            
            .button {
                height: 40px;
                font-size: 11px;
            }
            
            .button.number {
                font-size: 14px;
            }
            
            .button.operation {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="brand">TI-84 Plus</div>
        <div class="screen">
            <div class="display">
                <div class="expression" id="expression"></div>
                <div class="result" id="result">0</div>
            </div>
        </div>
        <div class="buttons">
            <button class="button function" onclick="clearAll()">2ND</button>
            <button class="button function" onclick="insertFunction('Math.PI')">π</button>
            <button class="button function" onclick="insertFunction('Math.E')">e</button>
            <button class="button clear" onclick="clearAll()">CLR</button>
            <button class="button clear" onclick="deleteLast()">DEL</button>

            <button class="button function" onclick="insertFunction('Math.sin(')">sin</button>
            <button class="button function" onclick="insertFunction('Math.cos(')">cos</button>
            <button class="button function" onclick="insertFunction('Math.tan(')">tan</button>
            <button class="button operation" onclick="insertOperator('(')">(</button>
            <button class="button operation" onclick="insertOperator(')')">)</button>

            <button class="button function" onclick="insertFunction('Math.log10(')">log</button>
            <button class="button function" onclick="insertFunction('Math.log(')">ln</button>
            <button class="button function" onclick="insertFunction('Math.sqrt(')">√</button>
            <button class="button operation" onclick="insertOperator('^')">^</button>
            <button class="button operation" onclick="insertOperator('/')">÷</button>

            <button class="button function" onclick="insertFunction('Math.pow(')">x²</button>
            <button class="button number" onclick="insertNumber('7')">7</button>
            <button class="button number" onclick="insertNumber('8')">8</button>
            <button class="button number" onclick="insertNumber('9')">9</button>
            <button class="button operation" onclick="insertOperator('*')">×</button>

            <button class="button function" onclick="insertOperator('!')">x!</button>
            <button class="button number" onclick="insertNumber('4')">4</button>
            <button class="button number" onclick="insertNumber('5')">5</button>
            <button class="button number" onclick="insertNumber('6')">6</button>
            <button class="button operation" onclick="insertOperator('-')">−</button>

            <button class="button function" onclick="insertFunction('1/')">1/x</button>
            <button class="button number" onclick="insertNumber('1')">1</button>
            <button class="button number" onclick="insertNumber('2')">2</button>
            <button class="button number" onclick="insertNumber('3')">3</button>
            <button class="button operation" onclick="insertOperator('+')">+</button>

            <button class="button function" onclick="toggleSign()">+/−</button>
            <button class="button number wide" onclick="insertNumber('0')">0</button>
            <button class="button number" onclick="insertNumber('.')">.</button>
            <button class="button equals" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        let currentExpression = '';
        let currentResult = '0';
        let lastResult = 0;

        const expressionDisplay = document.getElementById('expression');
        const resultDisplay = document.getElementById('result');

        function updateDisplay() {
            expressionDisplay.textContent = currentExpression;
            resultDisplay.textContent = currentResult;
        }

        function insertNumber(num) {
            if (currentResult === '0' || currentResult === 'Error') {
                currentResult = num;
            } else {
                currentResult += num;
            }
            currentExpression = currentResult;
            updateDisplay();
        }

        function insertOperator(operator) {
            if (currentResult === 'Error') {
                clearAll();
                return;
            }
            
            currentExpression = currentResult + ' ' + operator + ' ';
            currentResult = '0';
            updateDisplay();
        }

        function insertFunction(func) {
            if (currentResult === 'Error') {
                clearAll();
            }
            
            if (func === 'Math.PI') {
                currentResult = Math.PI.toString();
                currentExpression = 'π';
            } else if (func === 'Math.E') {
                currentResult = Math.E.toString();
                currentExpression = 'e';
            } else if (func === '1/') {
                try {
                    const value = parseFloat(currentResult);
                    currentResult = (1 / value).toString();
                    currentExpression = '1/(' + value + ')';
                } catch (e) {
                    currentResult = 'Error';
                }
            } else {
                currentExpression = func.replace('Math.', '') + '(' + currentResult + ')';
                try {
                    const value = parseFloat(currentResult);
                    let result;
                    
                    switch (func) {
                        case 'Math.sin(':
                            result = Math.sin(value);
                            break;
                        case 'Math.cos(':
                            result = Math.cos(value);
                            break;
                        case 'Math.tan(':
                            result = Math.tan(value);
                            break;
                        case 'Math.log10(':
                            result = Math.log10(value);
                            break;
                        case 'Math.log(':
                            result = Math.log(value);
                            break;
                        case 'Math.sqrt(':
                            result = Math.sqrt(value);
                            break;
                        case 'Math.pow(':
                            result = Math.pow(value, 2);
                            currentExpression = currentResult + '²';
                            break;
                        default:
                            result = value;
                    }
                    
                    currentResult = result.toString();
                } catch (e) {
                    currentResult = 'Error';
                }
            }
            
            updateDisplay();
        }

        function toggleSign() {
            if (currentResult === 'Error' || currentResult === '0') return;
            
            if (currentResult.startsWith('-')) {
                currentResult = currentResult.substring(1);
            } else {
                currentResult = '-' + currentResult;
            }
            
            currentExpression = currentResult;
            updateDisplay();
        }

        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        function calculateResult() {
            if (currentResult === 'Error') return;
            
            try {
                let expression = currentExpression;
                
                // Handle factorial
                if (expression.includes('!')) {
                    const num = parseFloat(currentResult);
                    currentResult = factorial(num).toString();
                    currentExpression = num + '!';
                    updateDisplay();
                    return;
                }
                
                // Handle basic arithmetic
                if (expression.includes('+') || expression.includes('−') || 
                    expression.includes('×') || expression.includes('÷')) {
                    
                    // Replace display symbols with JavaScript operators
                    expression = expression.replace(/×/g, '*')
                                         .replace(/÷/g, '/')
                                         .replace(/−/g, '-');
                    
                    // Handle power operator
                    expression = expression.replace(/\^/g, '**');
                    
                    // Evaluate the expression
                    const result = Function('"use strict"; return (' + expression + ')')();
                    
                    if (isNaN(result) || !isFinite(result)) {
                        currentResult = 'Error';
                    } else {
                        // Round to avoid floating point errors
                        currentResult = parseFloat(result.toPrecision(10)).toString();
                        lastResult = parseFloat(currentResult);
                    }
                    
                    currentExpression = expression + ' = ' + currentResult;
                }
                
            } catch (e) {
                currentResult = 'Error';
                currentExpression = 'Error';
            }
            
            updateDisplay();
        }

        function clearAll() {
            currentExpression = '';
            currentResult = '0';
            updateDisplay();
        }

        function deleteLast() {
            if (currentResult === 'Error') {
                clearAll();
                return;
            }
            
            if (currentResult.length > 1) {
                currentResult = currentResult.slice(0, -1);
            } else {
                currentResult = '0';
            }
            
            currentExpression = currentResult;
            updateDisplay();
        }

        // Keyboard support
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                insertNumber(key);
            } else if (key === '.') {
                insertNumber('.');
            } else if (key === '+') {
                insertOperator('+');
            } else if (key === '-') {
                insertOperator('−');
            } else if (key === '*') {
                insertOperator('×');
            } else if (key === '/') {
                event.preventDefault();
                insertOperator('÷');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculateResult();
            } else if (key === 'Escape' || key === 'c' || key === 'C') {
                clearAll();
            } else if (key === 'Backspace') {
                deleteLast();
            }
        });

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
