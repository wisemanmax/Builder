<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI-84 Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        :root {
            --bg-dark: #1a1a1a;
            --bg-calculator: #2c2c2c;
            --bg-screen: #0f1419;
            --text-primary: #00ff88;
            --text-secondary: #888;
            --button-bg: #3a3a3a;
            --button-hover: #4a4a4a;
            --button-active: #5a5a5a;
            --border-color: #444;
            --shadow: rgba(0, 255, 136, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator {
            background: var(--bg-calculator);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        0 0 20px var(--shadow);
            max-width: 320px;
            width: 100%;
        }

        .brand {
            text-align: center;
            margin-bottom: 15px;
        }

        .brand h1 {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-primary);
        }

        .brand p {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .screen {
            background: var(--bg-screen);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 80px;
            position: relative;
            overflow: hidden;
        }

        .display {
            font-size: 24px;
            font-weight: 700;
            text-align: right;
            color: var(--text-primary);
            word-wrap: break-word;
            text-shadow: 0 0 10px var(--shadow);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px var(--shadow); }
            to { text-shadow: 0 0 15px var(--shadow); }
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn {
            background: var(--button-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 700;
            padding: 15px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: var(--button-hover);
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            background: var(--button-active);
            transform: translateY(0);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .btn.operator {
            background: linear-gradient(145deg, #4a4a4a, #3a3a3a);
            color: #ffaa00;
        }

        .btn.function {
            background: linear-gradient(145deg, #5a5a5a, #4a4a4a);
            font-size: 11px;
        }

        .btn.equals {
            background: linear-gradient(145deg, var(--text-primary), #00cc66);
            color: var(--bg-dark);
            grid-column: span 2;
        }

        .btn.clear {
            background: linear-gradient(145deg, #ff4444, #cc3333);
            color: white;
        }

        .error-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        @media (max-width: 480px) {
            .calculator {
                padding: 20px;
                max-width: 300px;
            }
            
            .btn {
                padding: 12px 6px;
                font-size: 12px;
                min-height: 45px;
            }
            
            .display {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="brand">
            <h1>TI-84</h1>
            <p>GRAPHING CALCULATOR</p>
        </div>
        
        <div class="screen">
            <div class="display" id="display">0</div>
            <div class="error-indicator" id="errorIndicator" style="display: none;"></div>
        </div>
        
        <div class="buttons">
            <button class="btn function">2nd</button>
            <button class="btn function">MODE</button>
            <button class="btn function">DEL</button>
            <button class="btn clear" onclick="clearDisplay()">AC</button>
            
            <button class="btn function">ALPHA</button>
            <button class="btn function">GRAPH</button>
            <button class="btn function">TRACE</button>
            <button class="btn function">ZOOM</button>
            
            <button class="btn function">STAT</button>
            <button class="btn function">MATH</button>
            <button class="btn function">APPS</button>
            <button class="btn function">PRGM</button>
            
            <button class="btn function">X,T,θ,n</button>
            <button class="btn function">SIN</button>
            <button class="btn function">COS</button>
            <button class="btn function">TAN</button>
            
            <button class="btn operator" onclick="appendToDisplay('(')">(</button>
            <button class="btn operator" onclick="appendToDisplay(')')">)</button>
            <button class="btn operator" onclick="appendToDisplay('/')">/</button>
            <button class="btn function">LOG</button>
            
            <button class="btn" onclick="appendToDisplay('7')">7</button>
            <button class="btn" onclick="appendToDisplay('8')">8</button>
            <button class="btn" onclick="appendToDisplay('9')">9</button>
            <button class="btn operator" onclick="appendToDisplay('*')">×</button>
            
            <button class="btn" onclick="appendToDisplay('4')">4</button>
            <button class="btn" onclick="appendToDisplay('5')">5</button>
            <button class="btn" onclick="appendToDisplay('6')">6</button>
            <button class="btn operator" onclick="appendToDisplay('-')">-</button>
            
            <button class="btn" onclick="appendToDisplay('1')">1</button>
            <button class="btn" onclick="appendToDisplay('2')">2</button>
            <button class="btn" onclick="appendToDisplay('3')">3</button>
            <button class="btn operator" onclick="appendToDisplay('+')">+</button>
            
            <button class="btn" onclick="appendToDisplay('0')">0</button>
            <button class="btn" onclick="appendToDisplay('.')">.</button>
            <button class="btn operator" onclick="appendToDisplay('(-')">(−)</button>
            <button class="btn equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let shouldResetDisplay = false;

        function updateDisplay() {
            const display = document.getElementById('display');
            display.textContent = currentInput;
        }

        function appendToDisplay(value) {
            if (shouldResetDisplay) {
                currentInput = '0';
                shouldResetDisplay = false;
            }

            if (currentInput === '0' && value !== '.') {
                currentInput = value;
            } else {
                currentInput += value;
            }
            
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            shouldResetDisplay = false;
            hideErrorIndicator();
            updateDisplay();
        }

        function showErrorIndicator() {
            document.getElementById('errorIndicator').style.display = 'block';
        }

        function hideErrorIndicator() {
            document.getElementById('errorIndicator').style.display = 'none';
        }

        function calculate() {
            try {
                // Always show error regardless of input
                showError();
            } catch (error) {
                showError();
            }
        }

        function showError() {
            currentInput = 'ERROR';
            shouldResetDisplay = true;
            showErrorIndicator();
            updateDisplay();
            
            // Store error state in localStorage for persistence
            localStorage.setItem('calculatorState', JSON.stringify({
                display: currentInput,
                hasError: true,
                timestamp: Date.now()
            }));
        }

        // Load previous state on page load
        function loadState() {
            try {
                const saved = localStorage.getItem('calculatorState');
                if (saved) {
                    const state = JSON.parse(saved);
                    if (state.hasError) {
                        currentInput = 'ERROR';
                        showErrorIndicator();
                        shouldResetDisplay = true;
                    } else {
                        currentInput = state.display || '0';
                    }
                    updateDisplay();
                }
            } catch (error) {
                // If there's an error loading state, just start fresh
                currentInput = '0';
                updateDisplay();
            }
        }

        // Initialize calculator
        document.addEventListener('DOMContentLoaded', function() {
            loadState();
        });

        // Add keyboard support
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                appendToDisplay(key);
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                appendToDisplay(key);
            } else if (key === '.') {
                appendToDisplay('.');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Escape' || key === 'c' || key === 'C') {
                clearDisplay();
            } else if (key === '(') {
                appendToDisplay('(');
            } else if (key === ')') {
                appendToDisplay(')');
            }
        });
    </script>
</body>
</html>
