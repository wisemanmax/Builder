<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI-84 Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
        
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-calc: #3a3a3a;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --accent: #4a9eff;
            --button-bg: #4a4a4a;
            --button-hover: #5a5a5a;
            --button-active: #6a6a6a;
            --screen-bg: #0f0f0f;
            --green: #00ff00;
            --red: #ff4444;
            --orange: #ff8844;
            --blue: #4488ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator {
            background: var(--bg-calc);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }

        .brand {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .brand p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .screen {
            background: var(--screen-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            min-height: 120px;
            border: 2px solid var(--button-bg);
        }

        .display {
            font-size: 18px;
            color: var(--green);
            text-align: right;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .input-line {
            margin-bottom: 10px;
            min-height: 25px;
        }

        .result-line {
            font-size: 20px;
            font-weight: 500;
            border-top: 1px solid var(--button-bg);
            padding-top: 10px;
            margin-top: 10px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .btn {
            background: var(--button-bg);
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            height: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .btn:hover {
            background: var(--button-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            background: var(--button-active);
            transform: translateY(0);
        }

        .btn.wide {
            grid-column: span 2;
        }

        .btn.tall {
            grid-row: span 2;
            height: 108px;
        }

        .btn.primary {
            background: var(--accent);
            color: white;
        }

        .btn.primary:hover {
            background: #3a8eef;
        }

        .btn.secondary {
            background: var(--orange);
            color: white;
        }

        .btn.secondary:hover {
            background: #ee7734;
        }

        .btn.function {
            background: var(--blue);
            color: white;
            font-size: 12px;
        }

        .btn.function:hover {
            background: #3378ee;
        }

        .btn.small-text {
            font-size: 12px;
        }

        .error {
            color: var(--red) !important;
        }

        .history {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .history-item {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 5px;
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .calculator {
                padding: 20px;
            }
            
            .btn {
                height: 45px;
                font-size: 12px;
            }
            
            .btn.tall {
                height: 98px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="brand">
            <h1>TI-84</h1>
            <p>Graphing Calculator</p>
        </div>
        
        <div class="screen">
            <div class="display">
                <div class="history" id="history"></div>
                <div class="input-line" id="inputLine">0</div>
                <div class="result-line" id="resultLine"></div>
            </div>
        </div>
        
        <div class="button-grid">
            <!-- Row 1 -->
            <button class="btn function small-text" onclick="handleFunction('2nd')">2nd</button>
            <button class="btn function small-text" onclick="handleFunction('mode')">MODE</button>
            <button class="btn function small-text" onclick="handleFunction('del')">DEL</button>
            <button class="btn function small-text" onclick="handleFunction('alpha')">ALPHA</button>
            <button class="btn function small-text" onclick="handleFunction('graph')">GRAPH</button>
            
            <!-- Row 2 -->
            <button class="btn function small-text" onclick="handleFunction('y=')">Y=</button>
            <button class="btn function small-text" onclick="handleFunction('window')">WINDOW</button>
            <button class="btn function small-text" onclick="handleFunction('zoom')">ZOOM</button>
            <button class="btn function small-text" onclick="handleFunction('trace')">TRACE</button>
            <button class="btn function small-text" onclick="handleFunction('table')">TABLE</button>
            
            <!-- Row 3 -->
            <button class="btn" onclick="handleOperator('^')">^</button>
            <button class="btn function" onclick="handleFunction('sin')">SIN</button>
            <button class="btn function" onclick="handleFunction('cos')">COS</button>
            <button class="btn function" onclick="handleFunction('tan')">TAN</button>
            <button class="btn function" onclick="handleFunction('ln')">LN</button>
            
            <!-- Row 4 -->
            <button class="btn function" onclick="handleFunction('x²')">x²</button>
            <button class="btn" onclick="handleInput(',')">,</button>
            <button class="btn" onclick="handleInput('(')">(</button>
            <button class="btn" onclick="handleInput(')')">)</button>
            <button class="btn function" onclick="handleFunction('log')">LOG</button>
            
            <!-- Row 5 -->
            <button class="btn" onclick="handleNumber('7')">7</button>
            <button class="btn" onclick="handleNumber('8')">8</button>
            <button class="btn" onclick="handleNumber('9')">9</button>
            <button class="btn secondary" onclick="handleOperator('/')">/</button>
            <button class="btn function" onclick="handleFunction('sqrt')">√</button>
            
            <!-- Row 6 -->
            <button class="btn" onclick="handleNumber('4')">4</button>
            <button class="btn" onclick="handleNumber('5')">5</button>
            <button class="btn" onclick="handleNumber('6')">6</button>
            <button class="btn secondary" onclick="handleOperator('*')">×</button>
            <button class="btn function" onclick="handleFunction('x⁻¹')">x⁻¹</button>
            
            <!-- Row 7 -->
            <button class="btn" onclick="handleNumber('1')">1</button>
            <button class="btn" onclick="handleNumber('2')">2</button>
            <button class="btn" onclick="handleNumber('3')">3</button>
            <button class="btn secondary" onclick="handleOperator('-')">-</button>
            <button class="btn function" onclick="handleFunction('sto')">STO</button>
            
            <!-- Row 8 -->
            <button class="btn wide" onclick="handleNumber('0')">0</button>
            <button class="btn" onclick="handleInput('.')">.</button>
            <button class="btn secondary" onclick="handleOperator('+')">+</button>
            <button class="btn primary tall" onclick="calculate()">ENTER</button>
            
            <!-- Row 9 -->
            <button class="btn function" onclick="handleFunction('on')">ON</button>
            <button class="btn secondary" onclick="clearAll()">AC</button>
            <button class="btn secondary" onclick="clearEntry()">CE</button>
            <button class="btn function" onclick="handleFunction('ans')">ANS</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousResult = 0;
        let operator = null;
        let waitingForOperand = false;
        let history = [];
        let memory = 0;

        const inputLine = document.getElementById('inputLine');
        const resultLine = document.getElementById('resultLine');
        const historyDiv = document.getElementById('history');

        // Load history from localStorage
        function loadHistory() {
            const saved = localStorage.getItem('ti84_history');
            if (saved) {
                history = JSON.parse(saved);
                updateHistoryDisplay();
            }
        }

        // Save history to localStorage
        function saveHistory() {
            localStorage.setItem('ti84_history', JSON.stringify(history.slice(-10))); // Keep last 10 items
        }

        function updateDisplay() {
            inputLine.textContent = currentInput;
        }

        function updateHistoryDisplay() {
            historyDiv.innerHTML = history.slice(-5).map(item => 
                `<div class="history-item">${item}</div>`
            ).join('');
        }

        function handleNumber(num) {
            if (waitingForOperand) {
                currentInput = num;
                waitingForOperand = false;
            } else {
                currentInput = currentInput === '0' ? num : currentInput + num;
            }
            updateDisplay();
        }

        function handleInput(char) {
            if (char === '.' && currentInput.includes('.')) {
                return;
            }
            
            if (waitingForOperand) {
                if (char === '.') {
                    currentInput = '0.';
                } else {
                    currentInput = char;
                }
                waitingForOperand = false;
            } else {
                if (char === '.' && currentInput === '0') {
                    currentInput = '0.';
                } else {
                    currentInput += char;
                }
            }
            updateDisplay();
        }

        function handleOperator(nextOperator) {
            const inputValue = parseFloat(currentInput);

            if (operator && !waitingForOperand) {
                const result = performCalculation(previousResult, inputValue, operator);
                
                currentInput = String(result);
                previousResult = result;
                
                resultLine.textContent = result;
            } else {
                previousResult = inputValue;
            }

            waitingForOperand = true;
            operator = nextOperator;
            updateDisplay();
        }

        function performCalculation(prev, current, op) {
            switch (op) {
                case '+': return prev + current;
                case '-': return prev - current;
                case '*': return prev * current;
                case '/': return current !== 0 ? prev / current : 0;
                case '^': return Math.pow(prev, current);
                default: return current;
            }
        }

        function calculate() {
            const inputValue = parseFloat(currentInput);

            if (operator && !waitingForOperand) {
                const result = performCalculation(previousResult, inputValue, operator);
                
                // Add to history
                const expression = `${previousResult} ${operator === '*' ? '×' : operator} ${inputValue} = ${result}`;
                history.push(expression);
                saveHistory();
                updateHistoryDisplay();
                
                currentInput = String(result);
                resultLine.textContent = result;
                
                operator = null;
                previousResult = 0;
                waitingForOperand = true;
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousResult = 0;
            operator = null;
            waitingForOperand = false;
            resultLine.textContent = '';
            resultLine.classList.remove('error');
            updateDisplay();
        }

        function clearEntry() {
            currentInput = '0';
            updateDisplay();
        }

        function handleFunction(func) {
            const inputValue = parseFloat(currentInput);
            let result;

            try {
                switch (func) {
                    case 'sin':
                        result = Math.sin(inputValue * Math.PI / 180);
                        break;
                    case 'cos':
                        result = Math.cos(inputValue * Math.PI / 180);
                        break;
                    case 'tan':
                        result = Math.tan(inputValue * Math.PI / 180);
                        break;
                    case 'ln':
                        result = inputValue > 0 ? Math.log(inputValue) : NaN;
                        break;
                    case 'log':
                        result = inputValue > 0 ? Math.log10(inputValue) : NaN;
                        break;
                    case 'sqrt':
                        result = inputValue >= 0 ? Math.sqrt(inputValue) : NaN;
                        break;
                    case 'x²':
                        result = inputValue * inputValue;
                        break;
                    case 'x⁻¹':
                        result = inputValue !== 0 ? 1 / inputValue : Infinity;
                        break;
                    case 'ans':
                        currentInput = String(previousResult || 0);
                        updateDisplay();
                        return;
                    case 'sto':
                        memory = inputValue;
                        return;
                    case 'del':
                        if (currentInput.length > 1) {
                            currentInput = currentInput.slice(0, -1);
                        } else {
                            currentInput = '0';
                        }
                        updateDisplay();
                        return;
                    case '2nd':
                    case 'mode':
                    case 'alpha':
                    case 'graph':
                    case 'y=':
                    case 'window':
                    case 'zoom':
                    case 'trace':
                    case 'table':
                    case 'on':
                        // These would typically open menus or change modes
                        return;
                    default:
                        return;
                }

                if (isNaN(result) || !isFinite(result)) {
                    resultLine.textContent = 'Error';
                    resultLine.classList.add('error');
                    return;
                }

                const expression = `${func}(${inputValue}) = ${result}`;
                history.push(expression);
                saveHistory();
                updateHistoryDisplay();

                currentInput = String(result);
                resultLine.textContent = result;
                resultLine.classList.remove('error');
                waitingForOperand = true;

            } catch (error) {
                resultLine.textContent = 'Error';
                resultLine.classList.add('error');
            }

            updateDisplay();
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            
            if (key >= '0' && key <= '9') {
                handleNumber(key);
            } else if (key === '.') {
                handleInput('.');
            } else if (key === '+') {
                handleOperator('+');
            } else if (key === '-') {
                handleOperator('-');
            } else if (key === '*') {
                handleOperator('*');
            } else if (key === '/') {
                e.preventDefault();
                handleOperator('/');
            } else if (key === 'Enter' || key === '=') {
                calculate();
            } else if (key === 'Escape') {
                clearAll();
            } else if (key === 'Backspace') {
                handleFunction('del');
            } else if (key === '(') {
                handleInput('(');
            } else if (key === ')') {
                handleInput(')');
            }
        });

        // Initialize
        loadHistory();
        updateDisplay();
    </script>
</body>
</html>
