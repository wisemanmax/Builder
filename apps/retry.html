<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retry - Task Management with Theme Toggle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            /* Light theme colors */
            --bg-primary-light: #ffffff;
            --bg-secondary-light: #f8fafc;
            --bg-tertiary-light: #f1f5f9;
            --text-primary-light: #0f172a;
            --text-secondary-light: #475569;
            --text-tertiary-light: #64748b;
            --border-light: #e2e8f0;
            --accent-light: #3b82f6;
            --accent-hover-light: #2563eb;
            --success-light: #059669;
            --error-light: #dc2626;
            --warning-light: #d97706;

            /* Dark theme colors - improved contrast */
            --bg-primary-dark: #0f172a;
            --bg-secondary-dark: #1e293b;
            --bg-tertiary-dark: #334155;
            --text-primary-dark: #ffffff;
            --text-secondary-dark: #e2e8f0;
            --text-tertiary-dark: #cbd5e1;
            --border-dark: #334155;
            --accent-dark: #60a5fa;
            --accent-hover-dark: #3b82f6;
            --success-dark: #10b981;
            --error-dark: #ef4444;
            --warning-dark: #f59e0b;

            /* Active theme variables (default to dark) */
            --bg-primary: var(--bg-primary-dark);
            --bg-secondary: var(--bg-secondary-dark);
            --bg-tertiary: var(--bg-tertiary-dark);
            --text-primary: var(--text-primary-dark);
            --text-secondary: var(--text-secondary-dark);
            --text-tertiary: var(--text-tertiary-dark);
            --border: var(--border-dark);
            --accent: var(--accent-dark);
            --accent-hover: var(--accent-hover-dark);
            --success: var(--success-dark);
            --error: var(--error-dark);
            --warning: var(--warning-dark);

            /* Other design tokens */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --transition: all 200ms ease;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        [data-theme="light"] {
            --bg-primary: var(--bg-primary-light);
            --bg-secondary: var(--bg-secondary-light);
            --bg-tertiary: var(--bg-tertiary-light);
            --text-primary: var(--text-primary-light);
            --text-secondary: var(--text-secondary-light);
            --text-tertiary: var(--text-tertiary-light);
            --border: var(--border-light);
            --accent: var(--accent-light);
            --accent-hover: var(--accent-hover-light);
            --success: var(--success-light);
            --error: var(--error-light);
            --warning: var(--warning-light);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 300ms ease, color 300ms ease;
            min-height: 100vh;
        }

        .container {
            max-width: min(100%, 1200px);
            margin: 0 auto;
            padding: 1rem;
            width: 100%;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0 2.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2.5rem;
            gap: 1rem;
        }

        .header h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Theme Toggle */
        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 300ms ease;
            min-width: 48px;
            min-height: 48px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .theme-toggle:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .theme-toggle:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .theme-icon {
            font-size: 1.25rem;
            transition: transform 300ms ease;
        }

        .theme-toggle:hover .theme-icon {
            transform: scale(1.1);
        }

        /* Main Content */
        .main {
            display: grid;
            gap: 2.5rem;
            grid-template-columns: 1fr;
            width: 100%;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            transition: all 300ms ease;
            width: 100%;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        /* Task Form */
        .task-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        .form-label {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-input {
            padding: 1rem 1.25rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 300ms ease;
            min-height: 48px;
            width: 100%;
        }

        .form-input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .form-input.error {
            border-color: var(--error);
        }

        .form-error {
            color: var(--error);
            font-size: 14px;
            margin-top: 0.25rem;
        }

        /* Buttons */
        .btn {
            padding: 1rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 300ms ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 48px;
            text-decoration: none;
        }

        .btn:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-primary);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: color-mix(in srgb, var(--error) 90%, black);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Task List */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }

        .task-item {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            transition: all 300ms ease;
            width: 100%;
        }

        .task-item:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            gap: 1.5rem;
        }

        .task-title {
            font-weight: 500;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 14px;
            color: var(--text-tertiary);
            text-align: right;
            flex-shrink: 0;
        }

        .task-status {
            padding: 0.375rem 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .status-pending {
            background: color-mix(in srgb, var(--warning) 20%, transparent);
            color: var(--warning);
        }

        .status-success {
            background: color-mix(in srgb, var(--success) 20%, transparent);
            color: var(--success);
        }

        .status-error {
            background: color-mix(in srgb, var(--error) 20%, transparent);
            color: var(--error);
        }

        .task-error {
            color: var(--text-primary);
            background: color-mix(in srgb, var(--error) 10%, transparent);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 14px;
            margin: 0.75rem 0;
            border-left: 3px solid var(--error);
        }

        .task-actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            opacity: 0.7;
        }

        .empty-state-title {
            font-size: 1.125rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1rem 3rem 1rem 1rem;
            box-shadow: var(--shadow-lg);
            transform: translateX(100%);
            opacity: 0;
            transition: all 300ms ease;
            max-width: min(400px, calc(100vw - 2rem));
            z-index: 1000;
            font-size: 14px;
            position: relative;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .toast-success {
            border-left: 4px solid var(--success);
        }

        .toast-error {
            border-left: 4px solid var(--error);
        }

        .toast-close {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.25rem;
            padding: 0.25rem;
            line-height: 1;
            border-radius: var(--radius-sm);
            min-width: 24px;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 200ms ease;
        }

        .toast-close:hover {
            background: var(--bg-tertiary);
        }

        .toast-close:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Responsive Design */
        @media (max-width: 320px) {
            .container {
                padding: 0.75rem;
            }
            
            .header {
                padding: 1rem 0 1.5rem;
                margin-bottom: 1.5rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .card {
                padding: 1rem;
            }
            
            .task-header {
                flex-direction: column;
                gap: 0.75rem;
            }
            
            .task-meta {
                text-align: left;
            }
            
            .task-actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .toast {
                bottom: 0.5rem;
                right: 0.5rem;
                left: 0.5rem;
                max-width: none;
            }
        }

        @media (min-width: 321px) and (max-width: 479px) {
            .container {
                padding: 1rem;
            }
            
            .header {
                flex-wrap: wrap;
                gap: 1rem;
            }
            
            .task-header {
                flex-direction: column;
                gap: 1rem;
            }
            
            .task-meta {
                text-align: left;
            }
        }

        @media (min-width: 480px) {
            .task-form {
                flex-direction: row;
                align-items: end;
            }

            .form-group {
                flex: 1;
            }

            .form-group:last-child {
                flex: 0 0 auto;
            }

            .task-actions {
                justify-content: flex-end;
            }
        }

        @media (min-width: 768px) {
            .container {
                padding: 2rem;
            }

            .main {
                grid-template-columns: 1fr 1fr;
                gap: 3rem;
            }
            
            .header {
                padding: 2rem 0 3rem;
                margin-bottom: 3rem;
            }
        }

        @media (min-width: 1024px) {
            .main {
                grid-template-columns: 1fr 2fr;
            }
        }

        @media (min-width: 1200px) {
            .container {
                padding: 2.5rem;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Retry</h1>
            <button 
                class="theme-toggle" 
                id="themeToggle" 
                role="switch"
                aria-checked="true"
                aria-label="Toggle between light and dark theme"
                tabindex="0"
            >
                <span class="theme-icon" id="themeIcon" aria-hidden="true">🌙</span>
                <span class="theme-text" id="themeText">Dark</span>
            </button>
        </header>

        <main class="main">
            <section class="card">
                <h2 class="card-title">Add New Task</h2>
                <form class="task-form" id="taskForm">
                    <div class="form-group">
                        <label for="taskTitle" class="form-label">Task Title</label>
                        <input 
                            type="text" 
                            id="taskTitle" 
                            class="form-input" 
                            placeholder="Enter task title"
                            maxlength="200"
                            aria-describedby="taskTitleError"
                            required
                        >
                        <div id="taskTitleError" class="form-error" style="display: none;" role="alert"></div>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary" id="addTaskBtn">
                            <span id="addTaskText">Add Task</span>
                            <span id="addTaskSpinner" class="loading-spinner" style="display: none;"></span>
                        </button>
                    </div>
                </form>
            </section>

            <section class="card">
                <h2 class="card-title">Task Queue</h2>
                <div id="taskList" class="task-list" role="region" aria-label="List of tasks" aria-live="polite">
                    <!-- Tasks will be rendered here -->
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast" role="alert" aria-live="assertive" tabindex="-1">
        <span id="toastMessage"></span>
        <button class="toast-close" id="toastClose" aria-label="Close notification" tabindex="0">
            <span aria-hidden="true">×</span>
        </button>
    </div>

    <script>
        // Application State
        const state = {
            theme: 'dark',
            systemPreference: 'dark',
            tasks: [
                {
                    id: 1,
                    title: 'Deploy to production',
                    status: 'success',
                    attempts: 1,
                    maxAttempts: 3,
                    lastAttempt: new Date(Date.now() - 1000 * 60 * 5).toISOString()
                },
                {
                    id: 2,
                    title: 'Send email notifications',
                    status: 'error',
                    attempts: 2,
                    maxAttempts: 3,
                    lastAttempt: new Date(Date.now() - 1000 * 60 * 2).toISOString(),
                    error: 'Connection timeout'
                },
                {
                    id: 3,
                    title: 'Process payment batch',
                    status: 'pending',
                    attempts: 0,
                    maxAttempts: 5,
                    lastAttempt: null
                },
                {
                    id: 4,
                    title: 'Generate monthly reports',
                    status: 'error',
                    attempts: 3,
                    maxAttempts: 3,
                    lastAttempt: new Date(Date.now() - 1000 * 60 * 10).toISOString(),
                    error: 'Database connection failed'
                }
            ],
            nextTaskId: 5,
            retryingTasks: new Set(),
            addingTask: false,
            activeToasts: new Set()
        };

        // DOM Elements
        const elements = {
            themeToggle: document.getElementById('themeToggle'),
            themeIcon: document.getElementById('themeIcon'),
            themeText: document.getElementById('themeText'),
            taskForm: document.getElementById('taskForm'),
            taskTitle: document.getElementById('taskTitle'),
            taskTitleError: document.getElementById('taskTitleError'),
            taskList: document.getElementById('taskList'),
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toastMessage'),
            toastClose: document.getElementById('toastClose'),
            addTaskBtn: document.getElementById('addTaskBtn'),
            addTaskText: document.getElementById('addTaskText'),
            addTaskSpinner: document.getElementById('addTaskSpinner')
        };

        // Theme Management
        function detectSystemTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                return 'light';
            }
            return 'dark';
        }

        function loadThemeFromStorage() {
            try {
                const saved = localStorage.getItem('theme');
                return saved || detectSystemTheme();
            } catch (e) {
                return detectSystemTheme();
            }
        }

        function saveThemeToStorage(theme) {
            try {
                localStorage.setItem('theme', theme);
            } catch (e) {
                console.warn('Failed to save theme preference');
            }
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            
            // Update toggle button
            const isLight = theme === 'light';
            elements.themeIcon.textContent = isLight ? '☀️' : '🌙';
            elements.themeText.textContent = isLight ? 'Light' : 'Dark';
            elements.themeToggle.setAttribute('aria-checked', isLight.toString());
            elements.themeToggle.setAttribute('aria-label', 
                `Switch to ${isLight ? 'dark' : 'light'} theme. Currently using ${theme} theme.`);
            
            state.theme = theme;
            saveThemeToStorage(theme);
        }

        function toggleTheme() {
            const newTheme = state.theme === 'light' ? 'dark' : 'light';
            applyTheme(newTheme);
            showToast(`Switched to ${newTheme} theme`, 'success');
        }

        // Validation
        function validateTaskTitle(title) {
            const trimmed = title.trim();
            if (!trimmed) {
                return { valid: false, error: 'Task title is required' };
            }
            if (trimmed.length > 200) {
                return { valid: false, error: 'Task title must be 200 characters or less' };
            }
            
            // Check for duplicate titles
            const existingTask = state.tasks.find(task => 
                task.title.toLowerCase() === trimmed.toLowerCase()
            );
            if (existingTask) {
                return { valid: false, error: 'A task with this title already exists' };
            }
            
            return { valid: true, error: null };
        }

        function showValidationError(message) {
            elements.taskTitleError.textContent = message;
            elements.taskTitleError.style.display = 'block';
            elements.taskTitle.classList.add('error');
        }

        function clearValidationError() {
            elements.taskTitleError.style.display = 'none';
            elements.taskTitle.classList.remove('error');
        }

        function setAddTaskLoading(loading) {
            state.addingTask = loading;
            elements.addTaskBtn.disabled = loading;
            elements.addTaskText.style.display = loading ? 'none' : 'inline';
            elements.addTaskSpinner.style.display = loading ? 'inline-block' : 'none';
        }

        // Task Management
        function generateTaskId() {
            return state.nextTaskId++;
        }

        function addTask(title) {
            const validation = validateTaskTitle(title);
            if (!validation.valid) {
                showValidationError(validation.error);
                showToast(validation.error, 'error');
                return;
            }

            clearValidationError();
            setAddTaskLoading(true);

            // Simulate async operation
            setTimeout(() => {
                const newTask = {
                    id: generateTaskId(),
                    title: title.trim(),
                    status: 'pending',
                    attempts: 0,
                    maxAttempts: 3,
                    lastAttempt: null
                };

                state.tasks.unshift(newTask);
                saveTasksToStorage();
                renderTasks();
                setAddTaskLoading(false);
                showToast('Task added successfully', 'success');
                
                // Announce to screen readers
                announceToScreenReader(`Task "${title.trim()}" added to queue`);
            }, 500);
        }

        function retryTask(taskId) {
            const task = state.tasks.find(t => t.id === taskId);
            if (!task) return;

            if (task.attempts >= task.maxAttempts) {
                showToast('Maximum retry attempts reached', 'error');
                return;
            }

            if (state.retryingTasks.has(taskId)) {
                return; // Already retrying
            }

            state.retryingTasks.add(taskId);
            task.attempts++;
            task.lastAttempt = new Date().toISOString();
            task.status = 'pending';
            delete task.error;

            saveTasksToStorage();
            renderTasks();
            showToast('Retrying task...', 'success');
            
            // Announce to screen readers
            announceToScreenReader(`Retrying task "${task.title}"`);

            // Simulate task execution
            setTimeout(() => {
                const success = Math.random() > 0.4; // 60% success rate
                task.status = success ? 'success' : 'error';
                
                if (!success) {
                    const errors = [
                        'Connection timeout',
                        'Database error',
                        'Authentication failed',
                        'Rate limit exceeded',
                        'Service unavailable'
                    ];
                    task.error = errors[Math.floor(Math.random() * errors.length)];
                }

                state.retryingTasks.delete(taskId);
                saveTasksToStorage();
                renderTasks();
                showToast(
                    success ? 'Task completed successfully' : 'Task failed - can retry',
                    success ? 'success' : 'error'
                );
                
                // Announce to screen readers
                announceToScreenReader(
                    success ? `Task "${task.title}" completed successfully` : `Task "${task.title}" failed with error: ${task.error}`
                );
            }, 1500);
        }

        function deleteTask(taskId) {
            const index = state.tasks.findIndex(t => t.id === taskId);
            if (index > -1) {
                const taskTitle = state.tasks[index].title;
                state.tasks.splice(index, 1);
                state.retryingTasks.delete(taskId);
                saveTasksToStorage();
                renderTasks();
                showToast(`Task "${taskTitle}" deleted`, 'success');
                
                // Announce to screen readers
                announceToScreenReader(`Task "${taskTitle}" deleted`);
            }
        }

        function formatTimeAgo(dateString) {
            if (!dateString) return 'Never';
            
            const now = new Date();
            const date = new Date(dateString);
            const diff = now - date;
            
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (days > 0) return `${days}d ago`;
            if (hours > 0) return `${hours}h ago`;
            if (minutes > 0) return `${minutes}m ago`;
            return 'Just now';
        }

        function renderTasks() {
            const taskList = elements.taskList;
            
            if (state.tasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏱️</div>
                        <h3 class="empty-state-title">No tasks yet</h3>
                        <p>Add your first task to get started with retry management.</p>
                    </div>
                `;
                return;
            }

            taskList.innerHTML = state.tasks.map(task => {
                const isRetrying = state.retryingTasks.has(task.id);
                const retryButtonId = `retry-${task.id}`;
                const deleteButtonId = `delete-${task.id}`;
                
                return `
                    <div class="task-item">
                        <div class="task-header">
                            <h3 class="task-title">${escapeHtml(task.title)}</h3>
                            <div class="task-meta">
                                <span class="task-status status-${task.status}">${task.status.toUpperCase()}</span>
                                <span>${task.attempts}/${task.maxAttempts} attempts</span>
                                <span>Last: ${formatTimeAgo(task.lastAttempt)}</span>
                            </div>
                        </div>
                        ${task.error ? `<div class="task-error">Error: ${escapeHtml(task.error)}</div>` : ''}
                        <div class="task-actions">
                            ${task.status === 'error' && task.attempts < task.maxAttempts ? 
                                `<button 
                                    class="btn btn-primary" 
                                    id="${retryButtonId}"
                                    onclick="retryTask(${task.id})" 
                                    ${isRetrying ? 'disabled' : ''}
                                    aria-label="Retry task: ${escapeHtml(task.title)}"
                                >
                                    ${isRetrying ? '<span class="loading-spinner"></span>' : ''}
                                    ${isRetrying ? 'Retrying...' : `Retry (${task.maxAttempts - task.attempts} left)`}
                                </button>` : ''}
                            ${task.status === 'pending' && !isRetrying ? 
                                `<button class="btn btn-secondary" disabled>Processing...</button>` : ''}
                            <button 
                                class="btn btn-danger" 
                                id="${deleteButtonId}"
                                onclick="deleteTask(${task.id})"
                                aria-label="Delete task: ${escapeHtml(task.title)}"
                            >
                                Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function announceToScreenReader(message) {
            // Create a temporary element for screen reader announcements
            const announcement = document.createElement('div');
            announcement.setAttribute('aria-live', 'polite');
            announcement.setAttribute('aria-atomic', 'true');
            announcement.className = 'sr-only';
            announcement.textContent = message;
            
            document.body.appendChild(announcement);
            
            // Remove after announcement
            setTimeout(() => {
                document.body.removeChild(announcement);
            }, 1000);
        }

        // Storage Management
        function saveTasksToStorage() {
            try {
                localStorage.setItem('retryTasks', JSON.stringify(state.tasks));
                localStorage.setItem('retryNextTaskId', state.nextTaskId.toString());
            } catch (e) {
                console.warn('Failed to save tasks to localStorage');
            }
        }

        function loadTasksFromStorage() {
            try {
                const savedTasks = localStorage.getItem('retryTasks');
                const savedNextId = localStorage.getItem('retryNextTaskId');
                
                if (savedTasks && savedTasks !== 'null') {
                    const parsedTasks = JSON.parse(savedTasks);
                    if (Array.isArray(parsedTasks)) {
                        state.tasks = parsedTasks;
                    }
                }
                if (savedNextId && savedNextId !== 'null') {
                    const parsedId = parseInt(savedNextId, 10);
                    if (!isNaN(parsedId)) {
                        state.nextTaskId = parsedId;
                    }
                }
            } catch (e) {
                console.warn('Failed to load tasks from localStorage');
            }
        }

        // Toast Notifications
        function showToast(message, type = 'success') {
            // Clear any existing active toasts to prevent stacking
            state.activeToasts.forEach(toastId => {
                clearTimeout(toastId);
            });
            state.activeToasts.clear();
            
            const toast = elements.toast;
            elements.toastMessage.textContent = message;
            toast.className = `toast toast-${type}`;
            
            // Show toast
            const showTimeout = setTimeout(() => {
                toast.classList.add('show');
                // Focus management for accessibility
                const previousFocus = document.activeElement;
                toast.focus();
                
                // Store reference to return focus
                toast.setAttribute('data-previous-focus', previousFocus ? previousFocus.id || 'body' : 'body');
            }, 10);
            
            // Auto-hide toast after 5 seconds
            const hideTimeout = setTimeout(() => {
                hideToast();
            }, 5000);
            
            state.activeToasts.add(showTimeout);
            state.activeToasts.add(hideTimeout);
        }

        function hideToast() {
            const toast = elements.toast;
            toast.classList.remove('show');
            
            // Return focus to previous element
            const previousFocusId = toast.getAttribute('data-previous-focus');
            if (previousFocusId && previousFocusId !== 'body') {
                const previousElement = document.getElementById(previousFocusId);
                if (previousElement) {
                    previousElement.focus();
                }
            }
        }

        // Event Handlers
        function handleTaskFormSubmit(e) {
            e.preventDefault();
            
            if (state.addingTask) return;
            
            const title = elements.taskTitle.value.trim();
            
            if (!title) {
                showValidationError('Task title is required');
                showToast('Please enter a task title', 'error');
                return;
            }
            
            addTask(title);
            elements.taskTitle.value = '';
        }

        function handleSystemThemeChange(e) {
            const newSystemPreference = e.matches ? 'light' : 'dark';
            state.systemPreference = newSystemPreference;
            
            // If user hasn't manually set a theme, follow system preference
            const savedTheme = localStorage.getItem('theme');
            if (!savedTheme) {
                applyTheme(newSystemPreference);
            }
        }

        function handleThemeToggleKeydown(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleTheme();
            }
        }

        function handleTaskTitleInput() {
            clearValidationError();
        }

        function handleToastClose() {
            hideToast();
        }

        function handleToastKeydown(e) {
            if (e.key === 'Escape') {
                hideToast();
            }
        }

        // Global functions for inline event handlers
        window.retryTask = retryTask;
        window.deleteTask = deleteTask;

        // Initialization
        document.addEventListener('DOMContentLoaded', function() {
            // Load data from storage
            loadTasksFromStorage();
            
            // Initialize theme
            state.systemPreference = detectSystemTheme();
            const initialTheme = loadThemeFromStorage();
            applyTheme(initialTheme);
            
            // Set up theme toggle
            elements.themeToggle.addEventListener('click', toggleTheme);
            elements.themeToggle.addEventListener('keydown', handleThemeToggleKeydown);
            
            // Listen for system theme changes
            if (window.matchMedia) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: light)');
                mediaQuery.addListener(handleSystemThemeChange);
            }
            
            // Set up form submission and validation
            elements.taskForm.addEventListener('submit', handleTaskFormSubmit);
            elements.taskTitle.addEventListener('input', handleTaskTitleInput);
            
            // Set up toast close functionality
            elements.toastClose.addEventListener('click', handleToastClose);
            elements.toast.addEventListener('keydown', handleToastKeydown);
            
            // Initial render
            renderTasks();
            
            // Show welcome message
            setTimeout(() => {
                showToast('Welcome to Retry! Toggle themes with the button above.', 'success');
            }, 500);
        });
    </script>
</body>
</html>
