<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252547;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --text-muted: #666666;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --border: #374151;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px var(--shadow);
        }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .habits-section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .add-habit-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-habit-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .habits-list {
            display: grid;
            gap: 16px;
        }

        .habit-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .habit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .habit-info h4 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .habit-streak {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .habit-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .check-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .check-btn.completed {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .check-btn:hover {
            transform: scale(1.05);
        }

        .emoji-reactions {
            display: flex;
            gap: 8px;
        }

        .emoji-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .emoji-btn:hover {
            transform: scale(1.1);
            background: var(--accent);
        }

        .emoji-btn.selected {
            background: var(--accent);
            border-color: var(--accent);
        }

        .calendar-section {
            margin-bottom: 40px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .calendar-nav {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--accent);
        }

        .calendar-grid {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-header {
            text-align: center;
            padding: 12px 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .calendar-day {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .calendar-day.other-month {
            color: var(--text-muted);
        }

        .calendar-day.today {
            background: var(--accent);
            color: white;
        }

        .calendar-day.streak-1 { background: rgba(16, 185, 129, 0.2); }
        .calendar-day.streak-2 { background: rgba(16, 185, 129, 0.4); }
        .calendar-day.streak-3 { background: rgba(16, 185, 129, 0.6); }
        .calendar-day.streak-4 { background: rgba(16, 185, 129, 0.8); }
        .calendar-day.streak-5 { background: rgba(16, 185, 129, 1); color: white; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 32px;
            max-width: 480px;
            width: 90%;
            border: 1px solid var(--border);
        }

        .modal-header {
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }

            .habit-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .habit-actions {
                align-self: stretch;
                justify-content: space-between;
            }

            .calendar-nav {
                flex-direction: column;
                gap: 8px;
            }

            .modal-content {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Habit Tracker</h1>
            <p>Build better habits, one day at a time</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Habits</h3>
                <div class="value" id="totalHabits">5</div>
            </div>
            <div class="stat-card">
                <h3>Current Streak</h3>
                <div class="value" id="currentStreak">7</div>
            </div>
            <div class="stat-card">
                <h3>Best Streak</h3>
                <div class="value" id="bestStreak">15</div>
            </div>
            <div class="stat-card">
                <h3>Completion Rate</h3>
                <div class="value" id="completionRate">78%</div>
            </div>
        </div>

        <section class="habits-section">
            <div class="section-header">
                <h2 class="section-title">Today's Habits</h2>
                <button class="add-habit-btn" onclick="openAddHabitModal()">
                    <span>+</span> Add Habit
                </button>
            </div>
            <div class="habits-list" id="habitsList">
                <!-- Habits will be populated by JavaScript -->
            </div>
        </section>

        <section class="calendar-section">
            <div class="calendar-header">
                <h2 class="section-title">Monthly Heatmap</h2>
                <div class="calendar-nav">
                    <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
                    <span id="currentMonth">December 2024</span>
                    <button class="nav-btn" onclick="changeMonth(1)">›</button>
                </div>
            </div>
            <div class="calendar-grid">
                <div class="month-grid" id="calendarGrid">
                    <!-- Calendar will be populated by JavaScript -->
                </div>
            </div>
        </section>
    </div>

    <!-- Add Habit Modal -->
    <div class="modal" id="addHabitModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Habit</h3>
                <p style="color: var(--text-secondary);">Create a new habit to track</p>
            </div>
            <form id="addHabitForm">
                <div class="form-group">
                    <label for="habitName">Habit Name</label>
                    <input type="text" id="habitName" placeholder="e.g., Drink 8 glasses of water" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeAddHabitModal()">Cancel</button>
                    <button type="submit" class="add-habit-btn">Add Habit</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let habits = [
            { id: 1, name: 'Drink 8 glasses of water', streak: 7, completed: false, reaction: null },
            { id: 2, name: 'Exercise for 30 minutes', streak: 5, completed: true, reaction: '💪' },
            { id: 3, name: 'Read for 20 minutes', streak: 12, completed: true, reaction: '📚' },
            { id: 4, name: 'Meditate for 10 minutes', streak: 3, completed: false, reaction: null },
            { id: 5, name: 'Write in journal', streak: 15, completed: true, reaction: '✍️' }
        ];

        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();

        const emojis = ['😊', '💪', '🔥', '✨', '🎯', '📚', '✍️', '🏃‍♂️'];

        function renderHabits() {
            const habitsList = document.getElementById('habitsList');
            habitsList.innerHTML = '';

            habits.forEach(habit => {
                const habitCard = document.createElement('div');
                habitCard.className = 'habit-card';
                
                habitCard.innerHTML = `
                    <div class="habit-header">
                        <div class="habit-info">
                            <h4>${habit.name}</h4>
                            <div class="habit-streak">🔥 ${habit.streak} day streak</div>
                        </div>
                        <div class="habit-actions">
                            <div class="emoji-reactions">
                                ${emojis.map(emoji => `
                                    <button class="emoji-btn ${habit.reaction === emoji ? 'selected' : ''}" 
                                            onclick="setReaction(${habit.id}, '${emoji}')">
                                        ${emoji}
                                    </button>
                                `).join('')}
                            </div>
                            <button class="check-btn ${habit.completed ? 'completed' : ''}" 
                                    onclick="toggleHabit(${habit.id})">
                                ${habit.completed ? '✓' : '○'}
                            </button>
                        </div>
                    </div>
                `;

                habitsList.appendChild(habitCard);
            });
        }

        function toggleHabit(id) {
            const habit = habits.find(h => h.id === id);
            if (habit) {
                habit.completed = !habit.completed;
                if (habit.completed) {
                    habit.streak += 1;
                } else {
                    habit.streak = Math.max(0, habit.streak - 1);
                }
                renderHabits();
                updateStats();
            }
        }

        function setReaction(id, emoji) {
            const habit = habits.find(h => h.id === id);
            if (habit) {
                habit.reaction = habit.reaction === emoji ? null : emoji;
                renderHabits();
            }
        }

        function updateStats() {
            const totalHabits = habits.length;
            const completedToday = habits.filter(h => h.completed).length;
            const currentStreak = Math.min(...habits.map(h => h.streak));
            const bestStreak = Math.max(...habits.map(h => h.streak));
            const completionRate = totalHabits > 0 ? Math.round((completedToday / totalHabits) * 100) : 0;

            document.getElementById('totalHabits').textContent = totalHabits;
            document.getElementById('currentStreak').textContent = currentStreak;
            document.getElementById('bestStreak').textContent = bestStreak;
            document.getElementById('completionRate').textContent = completionRate + '%';
        }

        function renderCalendar() {
            const calendarGrid = document.getElementById('calendarGrid');
            const monthNames = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            document.getElementById('currentMonth').textContent = `${monthNames[currentMonth]} ${currentYear}`;

            calendarGrid.innerHTML = '';

            // Add day headers
            dayNames.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.textContent = day;
                calendarGrid.appendChild(dayHeader);
            });

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

            // Add previous month's days
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = document.createElement('div');
                day.className = 'calendar-day other-month';
                day.textContent = daysInPrevMonth - i;
                calendarGrid.appendChild(day);
            }

            // Add current month's days
            const today = new Date();
            for (let i = 1; i <= daysInMonth; i++) {
                const day = document.createElement('div');
                day.className = 'calendar-day';
                
                if (currentYear === today.getFullYear() && 
                    currentMonth === today.getMonth() && 
                    i === today.getDate()) {
                    day.classList.add('today');
                }

                // Simulate habit completion data
                const completionLevel = Math.floor(Math.random() * 6);
                if (completionLevel > 0) {
                    day.classList.add(`streak-${completionLevel}`);
                }

                day.textContent = i;
                calendarGrid.appendChild(day);
            }

            // Add next month's days
            const totalCells = calendarGrid.children.length - 7; // Subtract headers
            const remainingCells = 42 - totalCells; // 6 rows × 7 days
            for (let i = 1; i <= remainingCells; i++) {
                const day = document.createElement('div');
                day.className = 'calendar-day other-month';
                day.textContent = i;
                calendarGrid.appendChild(day);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function openAddHabitModal() {
            document.getElementById('addHabitModal').classList.add('active');
        }

        function closeAddHabitModal() {
            document.getElementById('addHabitModal').classList.remove('active');
            document.getElementById('habitName').value = '';
        }

        document.getElementById('addHabitForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const habitName = document.getElementById('habitName').value.trim();
            
            if (habitName) {
                const newHabit = {
                    id: Date.now(),
                    name: habitName,
                    streak: 0,
                    completed: false,
                    reaction: null
                };
                habits.push(newHabit);
                renderHabits();
                updateStats();
                closeAddHabitModal();
            }
        });

        // Close modal when clicking outside
        document.getElementById('addHabitModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeAddHabitModal();
            }
        });

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            renderHabits();
            updateStats();
            renderCalendar();
        });
    </script>
</body>
</html>
