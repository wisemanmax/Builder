    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-grid: #0e1b32;
            --text-primary: #eee6ff;
            --text-secondary: #a694c7;
            --accent-neon: #ff006e;
            --accent-cyan: #00d4ff;
            --accent-yellow: #ffbe0b;
            --accent-green: #8ac926;
            --tile-2: linear-gradient(135deg, #ff006e, #d62598);
            --tile-4: linear-gradient(135deg, #00d4ff, #0099cc);
            --tile-8: linear-gradient(135deg, #ffbe0b, #ff8500);
            --tile-16: linear-gradient(135deg, #8ac926, #5a9e0e);
            --tile-32: linear-gradient(135deg, #fb5607, #d63031);
            --tile-64: linear-gradient(135deg, #ff006e, #8338ec);
            --tile-128: linear-gradient(135deg, #3a86ff, #6c5ce7);
            --tile-256: linear-gradient(135deg, #ffbe0b, #f39c12);
            --tile-512: linear-gradient(135deg, #8ac926, #00b894);
            --tile-1024: linear-gradient(135deg, #ff006e, #e84393);
            --tile-2048: linear-gradient(135deg, #ffd700, #ff8c00);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            height: 100vh;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            height: 100vh;
            justify-content: space-between;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
        }
        
        .score-board {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .score-item {
            background: var(--bg-secondary);
            padding: 10px 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }
        
        .score-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        
        .score-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }
        
        .game-container {
            position: relative;
            background: var(--bg-grid);
            border-radius: 20px;
            padding: 20px;
            border: 3px solid var(--accent-neon);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.3);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 280px;
            height: 280px;
            position: relative;
        }
        
        .grid-cell {
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid rgba(166, 148, 199, 0.2);
        }
        
        .tile {
            position: absolute;
            width: 62.5px;
            height: 62.5px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.15s ease-in-out;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .tile.new {
            animation: tileAppear 0.2s ease-out;
        }
        
        .tile.merged {
            animation: tileMerge 0.3s ease-out;
        }
        
        .tile-2 { background: var(--tile-2); color: white; }
        .tile-4 { background: var(--tile-4); color: white; }
        .tile-8 { background: var(--tile-8); color: white; }
        .tile-16 { background: var(--tile-16); color: white; }
        .tile-32 { background: var(--tile-32); color: white; }
        .tile-64 { background: var(--tile-64); color: white; }
        .tile-128 { background: var(--tile-128); color: white; font-size: 1rem; }
        .tile-256 { background: var(--tile-256); color: white; font-size: 1rem; }
        .tile-512 { background: var(--tile-512); color: white; font-size: 1rem; }
        .tile-1024 { background: var(--tile-1024); color: white; font-size: 0.9rem; }
        .tile-2048 { background: var(--tile-2048); color: white; font-size: 0.9rem; }
        
        @keyframes tileAppear {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes tileMerge {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            z-index: 100;
            transform: scale(0);
            transition: transform 0.3s ease-out;
        }
        
        .game-over.show {
            transform: scale(1);
        }
        
        .game-over h2 {
            font-size: 2rem;
            color: var(--accent-neon);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .restart-btn {
            background: linear-gradient(135deg, var(--accent-neon), var(--accent-cyan));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 110, 0.3);
        }
        
        .restart-btn:hover {
            transform: scale(1.05);
        }
        
        .instructions {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: auto;
            padding: 20px;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-cyan);
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            animation: particle 1s ease-out forwards;
        }
        
        @keyframes particle {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0) translate(var(--dx), var(--dy)); }
        }
        
        @media (max-width: 480px) {
            .container { padding: 15px; }
            .title { font-size: 2rem; }
            .grid { width: 250px; height: 250px; }
            .tile { width: 55px; height: 55px; font-size: 1rem; }
            .tile-128, .tile-256, .tile-512 { font-size: 0.9rem; }
            .tile-1024, .tile-2048 { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">RETRO TILES</h1>
            <div class="score-board">
                <div class="score-item">
                    <div class="score-label">SCORE</div>
                    <div class="score-value" id="current-score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">BEST</div>
                    <div class="score-value" id="best-score">0</div>
                </div>
            </div>
        </div>
        
        <div class="game-container">
            <div class="grid" id="grid">
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
            </div>
            
            <div class="game-over" id="game-over">
                <h2>GAME OVER</h2>
                <button class="restart-btn" onclick="game.restart()">PLAY AGAIN</button>
            </div>
        </div>
        
        <div class="instructions">
            Swipe to move tiles • Combine matching numbers • Reach 2048!
        </div>
    </div>

    <script>
        class RetroTiles {
            constructor() {
                this.grid = Array(4).fill().map(() => Array(4).fill(0));
                this.score = 0;
                this.bestScore = parseInt(localStorage.getItem('retro-tiles-best') || '0');
                this.gameOver = false;
                this.touchStartX = 0;
                this.touchStartY = 0;
                this.minSwipeDistance = 50;
                
                this.updateDisplay();
                this.addRandomTile();
                this.addRandomTile();
                this.renderGrid();
                this.bindEvents();
            }
            
            bindEvents() {
                const grid = document.getElementById('grid');
                
                // Touch events
                grid.addEventListener('touchstart', (e) => {
                    if (this.gameOver) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.touchStartX = touch.clientX;
                    this.touchStartY = touch.clientY;
                }, { passive: false });
                
                grid.addEventListener('touchend', (e) => {
                    if (this.gameOver) return;
                    e.preventDefault();
                    const touch = e.changedTouches[0];
                    const deltaX = touch.clientX - this.touchStartX;
                    const deltaY = touch.clientY - this.touchStartY;
                    
                    if (Math.abs(deltaX) < this.minSwipeDistance && Math.abs(deltaY) < this.minSwipeDistance) {
                        return;
                    }
                    
                    if (Math.abs(deltaX) > Math.abs(deltaY)) {
                        if (deltaX > 0) {
                            this.move('right');
                        } else {
                            this.move('left');
                        }
                    } else {
                        if (deltaY > 0) {
                            this.move('down');
                        } else {
                            this.move('up');
                        }
                    }
                }, { passive: false });
                
                // Keyboard events
                document.addEventListener('keydown', (e) => {
                    if (this.gameOver) return;
                    switch(e.key) {
                        case 'ArrowUp': e.preventDefault(); this.move('up'); break;
                        case 'ArrowDown': e.preventDefault(); this.move('down'); break;
                        case 'ArrowLeft': e.preventDefault(); this.move('left'); break;
                        case 'ArrowRight': e.preventDefault(); this.move('right'); break;
                    }
                });
            }
            
            addRandomTile() {
                const emptyCells = [];
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (this.grid[r][c] === 0) {
                            emptyCells.push({r, c});
                        }
                    }
                }
                
                if (emptyCells.length > 0) {
                    const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.grid[randomCell.r][randomCell.c] = Math.random() < 0.9 ? 2 : 4;
                }
            }
            
            move(direction) {
                let moved = false;
                const newGrid = this.grid.map(row => [...row]);
                
                if (direction === 'left') {
                    for (let r = 0; r < 4; r++) {
                        const row = this.slideAndMergeRow(newGrid[r]);
                        if (JSON.stringify(row) !== JSON.stringify(newGrid[r])) moved = true;
                        newGrid[r] = row;
                    }
                } else if (direction === 'right') {
                    for (let r = 0; r < 4; r++) {
                        const row = this.slideAndMergeRow(newGrid[r].reverse()).reverse();
                        if (JSON.stringify(row) !== JSON.stringify(newGrid[r])) moved = true;
                        newGrid[r] = row;
                    }
                } else if (direction === 'up') {
                    for (let c = 0; c < 4; c++) {
                        const column = [newGrid[0][c], newGrid[1][c], newGrid[2][c], newGrid[3][c]];
                        const newColumn = this.slideAndMergeRow(column);
                        if (JSON.stringify(newColumn) !== JSON.stringify(column)) moved = true;
                        for (let r = 0; r < 4; r++) {
                            newGrid[r][c] = newColumn[r];
                        }
                    }
                } else if (direction === 'down') {
                    for (let c = 0; c < 4; c++) {
                        const column = [newGrid[3][c], newGrid[2][c], newGrid[1][c], newGrid[0][c]];
                        const newColumn = this.slideAndMergeRow(column);
                        if (JSON.stringify(newColumn) !== JSON.stringify(column)) moved = true;
                        for (let r = 0; r < 4; r++) {
                            newGrid[3-r][c] = newColumn[r];
                        }
                    }
                }
                
                if (moved) {
                    this.grid = newGrid;
                    this.addRandomTile();
                    this.renderGrid();
                    this.updateDisplay();
                    
                    if (this.isGameOver()) {
                        this.gameOver = true;
                        setTimeout(() => {
                            document.getElementById('game-over').classList.add('show');
                        }, 300);
                    }
                }
            }
            
            slideAndMergeRow(row) {
                const filtered = row.filter(val => val !== 0);
                const merged = [];
                let i = 0;
                
                while (i < filtered.length) {
                    if (i < filtered.length - 1 && filtered[i] === filtered[i + 1]) {
                        const mergedValue = filtered[i] * 2;
                        merged.push(mergedValue);
                        this.score += mergedValue;
                        this.createParticles(mergedValue);
                        i += 2;
                    } else {
                        merged.push(filtered[i]);
                        i++;
                    }
                }
                
                while (merged.length < 4) {
                    merged.push(0);
                }
                
                return merged;
            }
            
            createParticles(value) {
                const colors = ['#ff006e', '#00d4ff', '#ffbe0b', '#8ac926'];
                const container = document.querySelector('.game-container');
                
                for (let i = 0; i < 6; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.left = Math.random() * 280 + 'px';
                    particle.style.top = Math.random() * 280 + 'px';
                    particle.style.setProperty('--dx', (Math.random() - 0.5) * 100 + 'px');
                    particle.style.setProperty('--dy', (Math.random() - 0.5) * 100 + 'px');
                    
                    container.appendChild(particle);
                    setTimeout(() => particle.remove(), 1000);
                }
            }
            
            isGameOver() {
                // Check for empty cells
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (this.grid[r][c] === 0) return false;
                    }
                }
                
                // Check for possible merges
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const current = this.grid[r][c];
                        if ((r < 3 && this.grid[r + 1][c] === current) ||
                            (c < 3 && this.grid[r][c + 1] === current)) {
                            return false;
                        }
                    }
                }
                
                return true;
            }
            
            renderGrid() {
                const grid = document.getElementById('grid');
                const existingTiles = grid.querySelectorAll('.tile');
                existingTiles.forEach(tile => tile.remove());
                
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const value = this.grid[r][c];
                        if (value !== 0) {
                            const tile = document.createElement('div');
                            tile.className = `tile tile-${value} new`;
                            tile.textContent = value;
                            tile.style.left = (c * 72.5) + 'px';
                            tile.style.top = (r * 72.5) + 'px';
                            grid.appendChild(tile);
                            
                            setTimeout(() => tile.classList.remove('new'), 150);
                        }
                    }
                }
            }
            
            updateDisplay() {
                document.getElementById('current-score').textContent = this.score;
                
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('retro-tiles-best', this.bestScore.toString());
                }
                
                document.getElementById('best-score').textContent = this.bestScore;
            }
            
            restart() {
                this.grid = Array(4).fill().map(() => Array(4).fill(0));
                this.score = 0;
                this.gameOver = false;
                
                document.getElementById('game-over').classList.remove('show');
                
                this.addRandomTile();
                this.addRandomTile();
                this.renderGrid();
                this.updateDisplay();
            }
        }
        
        const game = new RetroTiles();
    </script>
</body>
