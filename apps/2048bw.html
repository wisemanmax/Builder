<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Fullscreen Puzzle Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --transition: all 150ms ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            font-size: clamp(14px, 2vw, 16px);
            line-height: 1.5;
        }

        .game-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            position: relative;
        }

        .game-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
            background: var(--bg-primary);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: min(90vw, 100%);
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .game-title {
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .score-display {
            background: var(--bg-secondary);
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            text-align: center;
            min-width: 80px;
        }

        .score-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-value {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0.25rem;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
        }

        .game-board {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 1rem;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        .grid-container {
            position: relative;
            width: min(80vw, 400px);
            height: min(80vw, 400px);
            max-width: 100%;
            max-height: 100%;
        }

        .grid-background {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0.5rem;
            width: 100%;
            height: 100%;
        }

        .grid-cell {
            background: var(--bg-tertiary);
            border-radius: 8px;
            aspect-ratio: 1;
        }

        .tiles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border-radius: 8px;
            transition: all 200ms ease;
            font-size: clamp(1rem, 3vw, 1.5rem);
        }

        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: clamp(0.8rem, 2.5vw, 1.2rem); }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: clamp(0.8rem, 2.5vw, 1.2rem); }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: clamp(0.8rem, 2.5vw, 1.2rem); }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: clamp(0.7rem, 2vw, 1rem); }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: clamp(0.7rem, 2vw, 1rem); }

        .game-instructions {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-primary);
            max-width: 400px;
            font-size: clamp(16px, 2.5vw, 18px);
        }

        .game-over-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .game-over-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: var(--border-radius);
            text-align: center;
            max-width: 90vw;
            box-shadow: var(--shadow-lg);
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .modal-score {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-message {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--danger);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            z-index: 10001;
            opacity: 0;
            transform: translateX(100%);
            transition: all 300ms ease;
        }

        .error-message.show {
            opacity: 1;
            transform: translateX(0);
        }

        @media (max-width: 480px) {
            .game-header {
                flex-direction: column;
                text-align: center;
            }

            .game-controls {
                width: 100%;
                justify-content: center;
            }

            .grid-container {
                width: min(90vw, 320px);
                height: min(90vw, 320px);
            }

            .modal-content {
                margin: 1rem;
            }
        }

        @media (min-width: 1024px) {
            .game-container {
                padding: 2rem;
            }

            .grid-container {
                width: min(80vw, 450px);
                height: min(80vw, 450px);
            }
        }

        .fullscreen-enter {
            animation: scaleIn 300ms ease;
        }

        .fullscreen-exit {
            animation: scaleOut 300ms ease;
        }

        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes scaleOut {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(0.95); opacity: 0; }
        }

        .tile-new {
            animation: popIn 200ms ease;
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <header class="game-header">
            <h1 class="game-title">2048</h1>
            <div class="game-controls">
                <div class="score-display">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="scoreValue">0</div>
                </div>
                <div class="score-display">
                    <div class="score-label">Best</div>
                    <div class="score-value" id="bestValue">0</div>
                </div>
                <button class="btn btn-secondary" id="newGameBtn">New Game</button>
                <button class="btn" id="fullscreenBtn">📺 Fullscreen</button>
            </div>
        </header>

        <main class="game-board">
            <div class="grid-container" id="gridContainer">
                <div class="grid-background">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="tiles-container" id="tilesContainer" role="grid" aria-label="2048 game board" aria-live="polite"></div>
            </div>
        </main>

        <div class="game-instructions">
            <p><strong>HOW TO PLAY:</strong> Use arrow keys or swipe to move tiles. When two tiles with the same number touch, they merge into one!</p>
        </div>
    </div>

    <div class="game-over-modal" id="gameOverModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle">Game Over!</h2>
            <p class="modal-score">Final Score: <span id="modalScore">0</span></p>
            <div class="modal-actions">
                <button class="btn" id="playAgainBtn">Play Again</button>
                <button class="btn btn-secondary" id="closeModalBtn">Close</button>
            </div>
        </div>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <script>
        const state = {
            board: Array(4).fill().map(() => Array(4).fill(0)),
            score: 0,
            bestScore: 0,
            isGameOver: false,
            hasWon: false,
            touchStart: null,
            isFullscreen: false,
            cellSize: 0,
            previousFocusedElement: null,
            isAnimating: false,
            animationQueue: []
        };

        const elements = {
            gameContainer: document.getElementById('gameContainer'),
            gridContainer: document.getElementById('gridContainer'),
            tilesContainer: document.getElementById('tilesContainer'),
            scoreValue: document.getElementById('scoreValue'),
            bestValue: document.getElementById('bestValue'),
            newGameBtn: document.getElementById('newGameBtn'),
            fullscreenBtn: document.getElementById('fullscreenBtn'),
            gameOverModal: document.getElementById('gameOverModal'),
            modalTitle: document.getElementById('modalTitle'),
            modalScore: document.getElementById('modalScore'),
            playAgainBtn: document.getElementById('playAgainBtn'),
            closeModalBtn: document.getElementById('closeModalBtn'),
            errorMessage: document.getElementById('errorMessage')
        };

        // Modal focus trap
        const focusableElements = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
        let modalFocusableElements = [];

        function showError(message) {
            elements.errorMessage.textContent = message;
            elements.errorMessage.classList.add('show');
            setTimeout(() => {
                elements.errorMessage.classList.remove('show');
            }, 3000);
        }

        function trapFocus(e) {
            if (!elements.gameOverModal.classList.contains('show')) return;
            
            if (e.key === 'Tab') {
                if (modalFocusableElements.length === 0) return;
                
                const firstElement = modalFocusableElements[0];
                const lastElement = modalFocusableElements[modalFocusableElements.length - 1];
                
                if (e.shiftKey) {
                    if (document.activeElement === firstElement) {
                        e.preventDefault();
                        lastElement.focus();
                    }
                } else {
                    if (document.activeElement === lastElement) {
                        e.preventDefault();
                        firstElement.focus();
                    }
                }
            }
        }

        function loadBestScore() {
            try {
                const saved = localStorage.getItem('2048-best-score');
                state.bestScore = saved ? parseInt(saved) : 0;
            } catch (e) {
                state.bestScore = 0;
            }
        }

        function saveBestScore() {
            try {
                localStorage.setItem('2048-best-score', state.bestScore.toString());
            } catch (e) {}
        }

        function updateScore(points = 0) {
            state.score += points;
            if (state.score > state.bestScore) {
                state.bestScore = state.score;
                saveBestScore();
            }
            elements.scoreValue.textContent = state.score.toLocaleString();
            elements.bestValue.textContent = state.bestScore.toLocaleString();
        }

        function calculateCellSize() {
            const container = elements.gridContainer;
            const rect = container.getBoundingClientRect();
            state.cellSize = (rect.width - 24) / 4; // Account for gaps
        }

        function getTilePosition(row, col) {
            const gap = 8;
            return {
                x: col * (state.cellSize + gap),
                y: row * (state.cellSize + gap)
            };
        }

        function createTileElement(value, row, col, isNew = false) {
            const tile = document.createElement('div');
            tile.className = `tile tile-${value}${isNew ? ' tile-new' : ''}`;
            tile.textContent = value;
            tile.setAttribute('role', 'gridcell');
            tile.setAttribute('aria-label', `Tile with value ${value} at row ${row + 1}, column ${col + 1}`);
            
            const pos = getTilePosition(row, col);
            tile.style.width = `${state.cellSize}px`;
            tile.style.height = `${state.cellSize}px`;
            tile.style.left = `${pos.x}px`;
            tile.style.top = `${pos.y}px`;
            
            return tile;
        }

        function renderBoard() {
            calculateCellSize();
            elements.tilesContainer.innerHTML = '';
            
            const tileCount = {};
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 4; col++) {
                    if (state.board[row][col] !== 0) {
                        const value = state.board[row][col];
                        tileCount[value] = (tileCount[value] || 0) + 1;
                        const tile = createTileElement(value, row, col);
                        elements.tilesContainer.appendChild(tile);
                    }
                }
            }
            
            // Update ARIA description
            const tileDescriptions = Object.entries(tileCount)
                .map(([value, count]) => `${count} tile${count > 1 ? 's' : ''} with value ${value}`)
                .join(', ');
            elements.tilesContainer.setAttribute('aria-description', 
                `Game board with score ${state.score}. Current tiles: ${tileDescriptions || 'no tiles'}`);
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 4; col++) {
                    if (state.board[row][col] === 0) {
                        emptyCells.push({ row, col });
                    }
                }
            }
            
            if (emptyCells.length === 0) return false;
            
            const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            const value = Math.random() < 0.9 ? 2 : 4;
            state.board[randomCell.row][randomCell.col] = value;
            
            // Add tile with animation
            setTimeout(() => {
                const tile = createTileElement(value, randomCell.row, randomCell.col, true);
                elements.tilesContainer.appendChild(tile);
            }, 50);
            
            return true;
        }

        function moveLeft() {
            let moved = false;
            let scoreGain = 0;
            
            for (let row = 0; row < 4; row++) {
                const newRow = state.board[row].filter(cell => cell !== 0);
                
                // Merge tiles
                for (let i = 0; i < newRow.length - 1; i++) {
                    if (newRow[i] === newRow[i + 1]) {
                        newRow[i] *= 2;
                        scoreGain += newRow[i];
                        if (newRow[i] === 2048 && !state.hasWon) {
                            state.hasWon = true;
                            showModal('You Win!', true);
                        }
                        newRow.splice(i + 1, 1);
                    }
                }
                
                // Fill with zeros
                while (newRow.length < 4) {
                    newRow.push(0);
                }
                
                // Check if row changed
                for (let col = 0; col < 4; col++) {
                    if (state.board[row][col] !== newRow[col]) {
                        moved = true;
                    }
                    state.board[row][col] = newRow[col];
                }
            }
            
            if (scoreGain > 0) {
                updateScore(scoreGain);
            }
            
            return moved;
        }

        function moveRight() {
            let moved = false;
            let scoreGain = 0;
            
            for (let row = 0; row < 4; row++) {
                const newRow = state.board[row].filter(cell => cell !== 0);
                
                // Merge tiles (from right)
                for (let i = newRow.length - 1; i > 0; i--) {
                    if (newRow[i] === newRow[i - 1]) {
                        newRow[i] *= 2;
                        scoreGain += newRow[i];
                        if (newRow[i] === 2048 && !state.hasWon) {
                            state.hasWon = true;
                            showModal('You Win!', true);
                        }
                        newRow.splice(i - 1, 1);
                        i--;
                    }
                }
                
                // Fill with zeros at the beginning
                while (newRow.length < 4) {
                    newRow.unshift(0);
                }
                
                // Check if row changed
                for (let col = 0; col < 4; col++) {
                    if (state.board[row][col] !== newRow[col]) {
                        moved = true;
                    }
                    state.board[row][col] = newRow[col];
                }
            }
            
            if (scoreGain > 0) {
                updateScore(scoreGain);
            }
            
            return moved;
        }

        function moveUp() {
            let moved = false;
            let scoreGain = 0;
            
            for (let col = 0; col < 4; col++) {
                const newCol = [];
                
                // Extract column
                for (let row = 0; row < 4; row++) {
                    if (state.board[row][col] !== 0) {
                        newCol.push(state.board[row][col]);
                    }
                }
                
                // Merge tiles
                for (let i = 0; i < newCol.length - 1; i++) {
                    if (newCol[i] === newCol[i + 1]) {
                        newCol[i] *= 2;
                        scoreGain += newCol[i];
                        if (newCol[i] === 2048 && !state.hasWon) {
                            state.hasWon = true;
                            showModal('You Win!', true);
                        }
                        newCol.splice(i + 1, 1);
                    }
                }
                
                // Fill with zeros
                while (newCol.length < 4) {
                    newCol.push(0);
                }
                
                // Update board
                for (let row = 0; row < 4; row++) {
                    if (state.board[row][col] !== newCol[row]) {
                        moved = true;
                    }
                    state.board[row][col] = newCol[row];
                }
            }
            
            if (scoreGain > 0) {
                updateScore(scoreGain);
            }
            
            return moved;
        }

        function moveDown() {
            let moved = false;
            let scoreGain = 0;
            
            for (let col = 0; col < 4; col++) {
                const newCol = [];
                
                // Extract column
                for (let row = 0; row < 4; row++) {
                    if (state.board[row][col] !== 0) {
                        newCol.push(state.board[row][col]);
                    }
                }
                
                // Merge tiles (from bottom)
                for (let i = newCol.length - 1; i > 0; i--) {
                    if (newCol[i] === newCol[i - 1]) {
                        newCol[i] *= 2;
                        scoreGain += newCol[i];
                        if (newCol[i] === 2048 && !state.hasWon) {
                            state.hasWon = true;
                            showModal('You Win!', true);
                        }
                        newCol.splice(i - 1, 1);
                        i--;
                    }
                }
                
                // Fill with zeros at the beginning
                while (newCol.length < 4) {
                    newCol.unshift(0);
                }
                
                // Update board
                for (let row = 0; row < 4; row++) {
                    if (state.board[row][col] !== newCol[row]) {
                        moved = true;
                    }
                    state.board[row][col] = newCol[row];
                }
            }
            
            if (scoreGain > 0) {
                updateScore(scoreGain);
            }
            
            return moved;
        }

        function canMove() {
            // Check for empty cells
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 4; col++) {
                    if (state.board[row][col] === 0) return true;
                }
            }
            
            // Check for possible merges
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 3; col++) {
                    if (state.board[row][col] === state.board[row][col + 1]) return true;
                }
            }
            
            for (let col = 0; col < 4; col++) {
                for (let row = 0; row < 3; row++) {
                    if (state.board[row][col] === state.board[row + 1][col]) return true;
                }
            }
            
            return false;
        }

        function processAnimationQueue() {
            if (state.animationQueue.length === 0) {
                state.isAnimating = false;
                return;
            }
            
            const nextMove = state.animationQueue.shift();
            executeMove(nextMove);
        }

        function executeMove(direction) {
            if (state.isGameOver) return;
            
            state.isAnimating = true;
            let moved = false;
            
            switch (direction) {
                case 'left': moved = moveLeft(); break;
                case 'right': moved = moveRight(); break;
                case 'up': moved = moveUp(); break;
                case 'down': moved = moveDown(); break;
            }
            
            if (moved) {
                setTimeout(() => {
                    renderBoard();
                    if (addRandomTile()) {
                        if (!canMove()) {
                            state.isGameOver = true;
                            setTimeout(() => showModal('Game Over!', false), 300);
                        }
                    }
                    setTimeout(() => processAnimationQueue(), 100);
                }, 100);
            } else {
                setTimeout(() => processAnimationQueue(), 50);
            }
        }

        function makeMove(direction) {
            if (state.isGameOver) return;
            
            if (state.isAnimating) {
                if (state.animationQueue.length < 3) {
                    state.animationQueue.push(direction);
                }
                return;
            }
            
            executeMove(direction);
        }

        function showModal(title, isWin) {
            state.previousFocusedElement = document.activeElement;
            elements.modalTitle.textContent = title;
            elements.modalScore.textContent = state.score.toLocaleString();
            elements.gameOverModal.classList.add('show');
            
            // Update focusable elements
            modalFocusableElements = Array.from(elements.gameOverModal.querySelectorAll(focusableElements));
            elements.playAgainBtn.focus();
        }

        function hideModal() {
            elements.gameOverModal.classList.remove('show');
            modalFocusableElements = [];
            if (state.previousFocusedElement) {
                state.previousFocusedElement.focus();
                state.previousFocusedElement = null;
            }
        }

        function newGame() {
            state.board = Array(4).fill().map(() => Array(4).fill(0));
            state.score = 0;
            state.isGameOver = false;
            state.hasWon = false;
            state.isAnimating = false;
            state.animationQueue = [];
            
            updateScore();
            addRandomTile();
            addRandomTile();
            renderBoard();
            hideModal();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                elements.gameContainer.requestFullscreen().then(() => {
                    state.isFullscreen = true;
                    elements.gameContainer.classList.add('fullscreen', 'fullscreen-enter');
                    elements.fullscreenBtn.textContent = '🔲 Exit Fullscreen';
                    setTimeout(() => {
                        elements.gameContainer.classList.remove('fullscreen-enter');
                        // Delay render to ensure proper sizing
                        setTimeout(() => renderBoard(), 100);
                    }, 300);
                }).catch(err => {
                    showError('Fullscreen mode is not supported on this device');
                });
            } else {
                document.exitFullscreen().then(() => {
                    state.isFullscreen = false;
                    elements.gameContainer.classList.add('fullscreen-exit');
                    elements.gameContainer.classList.remove('fullscreen');
                    elements.fullscreenBtn.textContent = '📺 Fullscreen';
                    setTimeout(() => {
                        elements.gameContainer.classList.remove('fullscreen-exit');
                        // Delay render to ensure proper sizing
                        setTimeout(() => renderBoard(), 100);
                    }, 300);
                });
            }
        }

        // Event handlers
        function handleKeyPress(e) {
            if (elements.gameOverModal.classList.contains('show')) {
                switch (e.key) {
                    case 'Escape':
                        e.preventDefault();
                        hideModal();
                        break;
                    case 'Enter':
                        if (document.activeElement === elements.playAgainBtn) {
                            newGame();
                        } else if (document.activeElement === elements.closeModalBtn) {
                            hideModal();
                        }
                        break;
                }
                return;
            }
            
            switch (e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    makeMove('left');
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    makeMove('right');
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    makeMove('up');
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    makeMove('down');
                    break;
                case 'Escape':
                    if (state.isFullscreen) {
                        toggleFullscreen();
                    }
                    break;
            }
        }

        function handleTouchStart(e) {
            e.preventDefault();
            state.touchStart = {
                x: e.touches[0].clientX,
                y: e.touches[0].clientY
            };
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            if (!state.touchStart || elements.gameOverModal.classList.contains('show')) return;
            
            const touchEnd = {
                x: e.changedTouches[0].clientX,
                y: e.changedTouches[0].clientY
            };
            
            const deltaX = touchEnd.x - state.touchStart.x;
            const deltaY = touchEnd.y - state.touchStart.y;
            const minSwipeDistance = 30;
            
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (Math.abs(deltaX) > minSwipeDistance) {
                    if (deltaX > 0) {
                        makeMove('right');
                    } else {
                        makeMove('left');
                    }
                }
            } else {
                if (Math.abs(deltaY) > minSwipeDistance) {
                    if (deltaY > 0) {
                        makeMove('down');
                    } else {
                        makeMove('up');
                    }
                }
            }
            
            state.touchStart = null;
        }

        function handleResize() {
            setTimeout(() => renderBoard(), 100);
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadBestScore();
            
            // Event listeners
            document.addEventListener('keydown', handleKeyPress);
            document.addEventListener('keydown', trapFocus);
            elements.gridContainer.addEventListener('touchstart', handleTouchStart);
            elements.gridContainer.addEventListener('touchend', handleTouchEnd);
            window.addEventListener('resize', handleResize);
            
            elements.newGameBtn.addEventListener('click', newGame);
            elements.fullscreenBtn.addEventListener('click', toggleFullscreen);
            elements.playAgainBtn.addEventListener('click', newGame);
            elements.closeModalBtn.addEventListener('click', hideModal);
            
            // Close modal on backdrop click
            elements.gameOverModal.addEventListener('click', (e) => {
                if (e.target === elements.gameOverModal) {
                    hideModal();
                }
            });
            
            // Handle fullscreen change
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement && state.isFullscreen) {
                    state.isFullscreen = false;
                    elements.gameContainer.classList.remove('fullscreen');
                    elements.fullscreenBtn.textContent = '📺 Fullscreen';
                    setTimeout(() => renderBoard(), 100);
                }
            });
            
            // Initialize game
            newGame();
        });
    </script>
</body>
</html>
